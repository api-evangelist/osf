openapi: 3.2.0
info:
  title: OSF APIv2 Documentation Actions API
  description: This is the official documentation for the OSF (Open Science Framework) API v2.
  version: '2.0'
  termsOfService: https://osf.io/terms_of_use/
  contact:
    name: OSF Support Team
    email: support@osf.io
    url: https://help.osf.io/
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  x-logo:
    url: https://cdn.cos.io/media/images/cos_center_logo_small.original.png
    backgroundColor: transparent
servers:
- url: https://api.test.osf.io/v2
tags:
- name: Actions
  description: Actions represent state transitions or comments performed on reviewable or request-related resources within the OSF platform, such as Preprints, Nodes, Preprint Requests, Node Requests, and Collection Submissions.
paths:
  /actions/reviews/:
    get:
      summary: List Review Actions
      description: 'Retrieve a list of review actions accessible to the authenticated user. Review actions document state transitions or user comments related specifically to reviewable resources, like preprints.

        Supports pagination and filtering by:

        - `id`

        - `trigger`

        - `from_state`

        - `to_state`

        - `date_created`

        - `date_modified`


        Pagination follows the JSON:API pagination specification.

        #### Permissions


        - User must be authenticated and have permissions to view actions associated with the respective resources.


        #### Errors

        If unsuccessful, returns an `errors` object. See Errors and Error Codes.'
      tags:
      - Actions
      operationId: review_action_list
      parameters:
      - name: page
        in: query
        description: Page number of the results to fetch.
        required: false
        schema:
          type: integer
      - name: per_page
        in: query
        description: Number of actions per page.
        required: false
        schema:
          type: integer
      - name: filter[id]
        in: query
        description: Filter by the unique ID of the review action.
        required: false
        schema:
          type: string
      - name: filter[trigger]
        in: query
        description: Filter by the trigger that initiated the action.
        required: false
        schema:
          type: string
      - name: filter[from_state]
        in: query
        description: Filter by the previous state of the resource.
        required: false
        schema:
          type: string
      - name: filter[to_state]
        in: query
        description: Filter by the new state of the resource.
        required: false
        schema:
          type: string
      - name: filter[date_created]
        in: query
        description: Filter by the creation date of the action.
        required: false
        schema:
          type: string
      - name: filter[date_modified]
        in: query
        description: Filter by the last modification date of the action.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful retrieval of review actions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - type
                      - attributes
                      - relationships
                      properties:
                        id:
                          type: string
                          description: A unique identifier representing the action.
                          example: abc123
                        type:
                          type: string
                          description: Specifies the resource type of the action, indicating the workflow it belongs to.
                          enum:
                          - review-actions
                          - node-request-actions
                          - preprint-request-actions
                          - registration-actions
                          - schema-response-actions
                          - collection-submission-actions
                          example: review-actions
                        attributes:
                          type: object
                          required:
                          - trigger
                          - from_state
                          - to_state
                          - date_created
                          - date_modified
                          properties:
                            trigger:
                              type: string
                              description: "The event that initiated this action, representing workflow triggers such as:\n - `submit`: Submitting for review\n - `accept`: Accepting the submission\n - `reject`: Rejecting the submission\n - `withdraw`: Withdrawing the submission\n - `edit_comment`: Editing an existing comment"
                              example: accept
                            comment:
                              type: string
                              description: Optional explanatory comment provided by the user who triggered the action, offering context or justification.
                              example: Approved after careful consideration.
                            from_state:
                              type: string
                              description: The state of the resource immediately before the action occurred, e.g., `pending`, `initial`, `accepted`, `rejected`.
                              example: pending
                            to_state:
                              type: string
                              description: The state of the resource immediately after the action occurred, e.g., `accepted`, `rejected`, `withdrawn`.
                              example: accepted
                            date_created:
                              type: string
                              format: date-time
                              description: Timestamp when the action was first created.
                              example: '2024-01-01T00:00:00Z'
                            date_modified:
                              type: string
                              format: date-time
                              description: Timestamp when the action was last modified.
                              example: '2024-01-01T01:00:00Z'
                            auto:
                              type: boolean
                              description: Indicates whether the action was system-generated (`true`) or manually performed by a user (`false`).
                              example: false
                            visible:
                              type: boolean
                              description: Controls the visibility of the action. Visible (`true`) actions are accessible to general users, while non-visible (`false`) actions are restricted to administrators or moderators.
                              example: true
                        relationships:
                          type: object
                          required:
                          - creator
                          - target
                          - provider
                          properties:
                            creator:
                              type: object
                              description: Information about the user who initiated the action.
                              properties:
                                links:
                                  type: object
                                  properties:
                                    related:
                                      type: object
                                      properties:
                                        href:
                                          type: string
                                          format: uri
                                          example: https://api.osf.io/v2/users/user456/
                                        meta:
                                          type: object
                                          example: {}
                                data:
                                  type: object
                                  properties:
                                    id:
                                      type: string
                                      example: user456
                                    type:
                                      type: string
                                      example: users
                            target:
                              type: object
                              description: The resource (e.g., preprint, registration, schema response) directly affected by this action.
                              properties:
                                links:
                                  type: object
                                  properties:
                                    related:
                                      type: object
                                      properties:
                                        href:
                                          type: string
                                          format: uri
                                          example: https://api.osf.io/v2/preprints/preprint789/
                                        meta:
                                          type: object
                                          example: {}
                                data:
                                  type: object
                                  properties:
                                    id:
                                      type: string
                                      example: preprint789
                                    type:
                                      type: string
                                      example: preprints
                            provider:
                              type: object
                              description: The provider managing the moderation or review process associated with the action's target resource.
                              properties:
                                links:
                                  type: object
                                  properties:
                                    related:
                                      type: object
                                      properties:
                                        href:
                                          type: string
                                          format: uri
                                          example: https://api.osf.io/v2/providers/preprints/osf/
                                        meta:
                                          type: object
                                          example: {}
                                data:
                                  type: object
                                  properties:
                                    id:
                                      type: string
                                      example: osf
                                    type:
                                      type: string
                                      example: preprint-providers
                        links:
                          type: object
                          properties:
                            self:
                              type: string
                              format: uri
                              description: Direct URL to access detailed information about this action.
                              example: https://api.osf.io/v2/actions/abc123/
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
                        description: Total number of actions available.
                        example: 1
                      per_page:
                        type: integer
                        description: Number of actions per page.
                        example: 10
                      version:
                        type: string
                        description: API version.
                        example: '2.20'
                  links:
                    type: object
                    properties:
                      self:
                        type: string
                        format: uri
                        description: Link to the current page of results.
                        example: https://api.osf.io/v2/actions/reviews/
                      next:
                        type: string
                        format: uri
                        description: Link to the next page of results.
                        example: https://api.osf.io/v2/actions/reviews/?page=2
                      prev:
                        type: string
                        format: uri
                        description: Link to the previous page of results.
                        example: https://api.osf.io/v2/actions/reviews/?page=1
        '400':
          description: Bad request. Invalid filter or pagination parameters.
        '403':
          description: Forbidden. The user does not have permission to view these review actions.
  /actions/requests/nodes/:
    post:
      summary: Create a Node Request Action
      description: 'Create a new action on an existing Node Request.

        Node Request Actions represent user-driven or automated steps in a moderation workflow for requests related to project nodes (e.g., access, registration withdrawal). They capture state transitions and optional comments.

        #### Available Triggers

        Supported `trigger` values:

        - `submit`: Submit the request for review. (No special permissions required)

        - `accept`: Approve the request. (Requires admin permissions on the node)

        - `reject`: Deny the request. (Requires admin permissions)

        - `edit_comment`: Add or update a moderator/admin comment without state change. (Requires admin permissions)


        #### Permissions


        - Accept/reject/edit_comment: Requires admin permissions on the associated node.

        - Submit: Allowed by any user with write permissions on the node.


        #### Returns

        On success, returns `201 Created` with the newly created action resource in the `data` key.

        #### Errors


        - `400 Bad Request`: Malformed or incomplete payload.

        - `403 Forbidden`: Insufficient privileges to perform the trigger.

        - `409 Conflict`: Trigger is invalid in the current state.


        See Errors and Error Codes for full reference.'
      tags:
      - Actions
      operationId: node_request_action_create
      responses:
        '201':
          description: Node Request Action successfully created.
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - type
                - attributes
                - relationships
                properties:
                  id:
                    type: string
                    description: A unique identifier representing the action.
                    example: abc123
                  type:
                    type: string
                    description: Specifies the resource type of the action, indicating the workflow it belongs to.
                    enum:
                    - review-actions
                    - node-request-actions
                    - preprint-request-actions
                    - registration-actions
                    - schema-response-actions
                    - collection-submission-actions
