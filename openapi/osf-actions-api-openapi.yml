  /actions/{action_id}/:
    get:
      summary: Retrieve an Action by ID
      description: 'Retrieve detailed information about a specific Action using its unique identifier.

        Actions record state transitions, user comments, and workflow triggers related to resources like preprints, registrations, node requests, schema responses, and collection submissions.

        An Action includes:

        - The initiating event (`trigger`)

        - Optional user-provided comments (`comment`)

        - Resource state before (`from_state`) and after (`to_state`) the action

        - Metadata such as timestamps (`date_created`, `date_modified`) and visibility settings (`visible`)

        - Relationships linking the action to its creator, target resource, and the provider managing the process.


        #### Permissions


        - Users must have at least read permissions on the associated resource.

        - Non-public actions (`visible: false`) require administrative or moderator privileges.


        #### Errors

        An unsuccessful request returns an `errors` key. Refer to the Errors and Error Codes documentation.'
      tags:
      - Actions
      operationId: action_detail_read
      parameters:
      - in: path
        name: action_id
        required: true
        description: Unique identifier for the action (e.g., `abc123`).
        schema:
          type: string
      responses:
        '200':
          description: Action retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - type
                - attributes
                - relationships
                properties:
                  id:
                    type: string
                    description: A unique identifier representing the action.
                    example: abc123
                  type:
                    type: string
                    description: Specifies the resource type of the action, indicating the workflow it belongs to.
                    enum:
                    - review-actions
                    - node-request-actions
                    - preprint-request-actions
                    - registration-actions
                    - schema-response-actions
                    - collection-submission-actions
                    example: review-actions
                  attributes:
                    type: object
                    required:
                    - trigger
                    - from_state
                    - to_state
                    - date_created
                    - date_modified
                    properties:
                      trigger:
                        type: string
                        description: "The event that initiated this action, representing workflow triggers such as:\n - `submit`: Submitting for review\n - `accept`: Accepting the submission\n - `reject`: Rejecting the submission\n - `withdraw`: Withdrawing the submission\n - `edit_comment`: Editing an existing comment"
                        example: accept
                      comment:
                        type: string
                        description: Optional explanatory comment provided by the user who triggered the action, offering context or justification.
                        example: Approved after careful consideration.
                      from_state:
                        type: string
                        description: The state of the resource immediately before the action occurred, e.g., `pending`, `initial`, `accepted`, `rejected`.
                        example: pending
                      to_state:
                        type: string
                        description: The state of the resource immediately after the action occurred, e.g., `accepted`, `rejected`, `withdrawn`.
                        example: accepted
                      date_created:
                        type: string
                        format: date-time
                        description: Timestamp when the action was first created.
                        example: '2024-01-01T00:00:00Z'
                      date_modified:
                        type: string
                        format: date-time
                        description: Timestamp when the action was last modified.
                        example: '2024-01-01T01:00:00Z'
                      auto:
                        type: boolean
                        description: Indicates whether the action was system-generated (`true`) or manually performed by a user (`false`).
                        example: false
                      visible:
                        type: boolean
