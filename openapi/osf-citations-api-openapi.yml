openapi: 3.2.0
info:
  title: OSF APIv2 Documentation Citations API
  description: This is the official documentation for the OSF (Open Science Framework) API v2.
  version: '2.0'
  termsOfService: https://osf.io/terms_of_use/
  contact:
    name: OSF Support Team
    email: support@osf.io
    url: https://help.osf.io/
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  x-logo:
    url: https://cdn.cos.io/media/images/cos_center_logo_small.original.png
    backgroundColor: transparent
servers:
- url: https://api.test.osf.io/v2
tags:
- name: Citations
paths:
  /citations/styles/:
    get:
      summary: List all citation styles
      description: 'A paginated list of all standard citation styles available for rendering citations.

        #### Returns

        Returns a JSON object containing `data` and `links` keys.


        The `data` key contains an array of 10 citation styles. Each resource in the array is a separate citation syle and contains the full representation of the citation style object.


        The `links` key contains a dictionary of links that can be used for pagination.


        This request should never return an error.

        #### Filtering

        You can optionally request that the response only include citation styles that match your filters by utilizing the `filter` query parameter, e.g. https://api.osf.io/v2/citations/styles/?filter[title]=open.


        Citation styles may be filtered by their `id`, `title`, `short-title`, and `summary`.

        #### Errors

        This request should never return an error.'
      tags:
      - Citations
      operationId: citations_styles_list
      x-response-schema: Citation Style
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  title: Citation Style
                  required:
                  - id
                  - type
                  - attributes
                  properties:
                    id:
                      type: string
                      readOnly: true
                      description: The identifier of the citation style, e.g. APA.
                    type:
                      type: string
                      readOnly: true
                      description: The type identifier of the citation style entity (`citation-styles`).
                    attributes:
                      type: object
                      title: Attributes
                      readOnly: true
                      required:
                      - date_parsed
                      - title
                      description: The properties of the citation style entity.
                      properties:
                        date_parsed:
                          type: string
                          format: date-time
                          readOnly: true
                          description: The time at which the citation style was first parsed, as an iso8601 formatted timestamp.
                        short_title:
                          type: string
                          readOnly: true
                          description: The short name for the citation style.
                        summary:
                          type: string
                          readOnly: true
                          description: The summary of the citation style.
                        title:
                          type: string
                          readOnly: true
                          description: The official name of the citation style.
                    links:
                      type: object
                      title: Links
                      readOnly: true
                      description: URLs to alternative representations of the citation style entity.
              example:
                data:
                - links: {}
                  attributes:
                    date_parsed: '2015-02-16T04:16:25.732000'
                    summary: null
                    short_title: AMR
                    title: Academy of Management Review
                  type: citation-styles
                  id: academy-of-management-review
                links:
                  first: null
                  last: https://api.osf.io/v2/citations/styles/?page=115
                  prev: null
                  next: https://api.osf.io/v2/citations/styles/?page=2
                  meta:
                    total: 1149
                    per_page: 10
  /citations/styles/{style_id}/:
    get:
      summary: Retrieve a citation style
      description: 'Retrieves the details of a citation style.

        #### Returns

        Returns a JSON object with a `data` key containing the representation of the requested citation style, if the request is successful.

        #### Errors

        If the request is unsuccessful, an `errors` key containing information about the failure will be returned. Refer to the list of error codes to understand why this request may have failed.'
      parameters:
      - description: The unique identifier of the citation style.
        required: true
        name: style_id
        in: path
        schema:
          type: string
      tags:
      - Citations
      operationId: citations_styles_read
      x-response-schema: Citation Style
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                title: Citation Style
                required:
                - id
                - type
                - attributes
                properties:
                  id:
                    type: string
                    readOnly: true
                    description: The identifier of the citation style, e.g. APA.
                  type:
                    type: string
                    readOnly: true
                    description: The type identifier of the citation style entity (`citation-styles`).
                  attributes:
                    type: object
                    title: Attributes
                    readOnly: true
                    required:
                    - date_parsed
                    - title
                    description: The properties of the citation style entity.
                    properties:
                      date_parsed:
                        type: string
                        format: date-time
                        readOnly: true
                        description: The time at which the citation style was first parsed, as an iso8601 formatted timestamp.
                      short_title:
                        type: string
                        readOnly: true
                        description: The short name for the citation style.
                      summary:
                        type: string
                        readOnly: true
                        description: The summary of the citation style.
                      title:
                        type: string
                        readOnly: true
                        description: The official name of the citation style.
                  links:
                    type: object
                    title: Links
                    readOnly: true
                    description: URLs to alternative representations of the citation style entity.
              example:
                data:
                  links: {}
                  attributes:
                    date_parsed: '2015-02-16T04:16:26.233000'
                    summary: null
                    short_title: APA
                    title: American Psychological Association 6th edition
                  type: citation-styles
                  id: apa
