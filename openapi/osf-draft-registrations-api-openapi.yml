  /draft_registrations/{draft_id}/bibliographic_contributors/:
    get:
      summary: List bibliographic contributors on a draft registration
      description: Retrieve a list of contributors marked as bibliographic (visible) for a draft registration.
      tags:
      - Draft Registrations
      operationId: draft_registration_bibliographic_contributors_list
      parameters:
      - name: draft_id
        in: path
        required: true
        description: Draft registration ID.
        schema:
          type: string
      responses:
        '200':
          description: Bibliographic contributors retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - type
                      - attributes
                      properties:
                        id:
                          type: string
                          description: Contributor ID
                        type:
                          type: string
                          example: contributors
                        attributes:
                          type: object
                          properties:
                            full_name:
                              type: string
                            bibliographic:
                              type: boolean
                              description: Indicates if the contributor is visible.
                            email:
                              type: string
                              description: Email of the contributor.
                example:
                  data:
                  - id: user123
                    type: contributors
                    attributes:
                      full_name: Alice Smith
                      bibliographic: true
                      email: alice@example.com
                  - id: user456
                    type: contributors
                    attributes:
                      full_name: Bob Jones
                      bibliographic: true
                      email: bob@example.com
        '403':
          description: Forbidden.
        '404':
          description: Draft registration not found.
  /draft_registrations/{draft_id}/relationships/institutions/:
    get:
      summary: Retrieve affiliated institutions for a draft registration
      description: 'Retrieve the list of institutions currently affiliated with a draft registration.

        Returns institution IDs in JSON:API relationship format.'
      tags:
      - Draft Registrations
      operationId: draft_registration_institutions_relationship_retrieve
      parameters:
      - name: draft_id
        in: path
        required: true
        description: The unique identifier of the draft registration.
        schema:
          type: string
      responses:
        '200':
          description: Institutions retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                      - type
                      - id
                      properties:
                        type:
                          type: string
                          example: institutions
                          description: The resource type; must be `institutions`.
                        id:
                          type: string
                          example: inst123
                          description: The unique identifier of the institution.
                example:
                  data:
                  - type: institutions
                    id: inst123
                  - type: institutions
                    id: inst456
        '403':
          description: Forbidden. You do not have permission to view affiliated institutions.
        '404':
          description: Draft registration not found.
    post:
      summary: Add affiliated institutions to a draft registration
      description: 'Add one or more institutions to a draft registration by their identifiers.

        The user must be affiliated with the institutions they are attempting to add.'
      tags:
      - Draft Registrations
      operationId: draft_registration_institutions_relationship_add
      parameters:
      - name: draft_id
        in: path
        required: true
        description: The unique identifier of the draft registration.
        schema:
          type: string
      responses:
        '204':
          description: Institutions added successfully.
        '400':
          description: Bad Request. User is not affiliated with the specified institution(s).
        '403':
          description: Forbidden. You do not have permission to add institutions.
        '404':
          description: Draft registration not found.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: array
                  items:
                    type: object
                    required:
                    - type
                    - id
                    properties:
                      type:
                        type: string
                        example: institutions
                        description: The resource type; must be `institutions`.
                      id:
                        type: string
                        example: inst123
                        description: The unique ID of the institution to add.
        description: JSON:API list of institution identifiers to associate with the draft registration.
        required: true
    delete:
      summary: Remove affiliated institutions from a draft registration
      description: 'Remove one or more institutions from the draft registration by their identifiers.

        This operation only modifies the relationship and does not delete the institutions themselves.'
      tags:
      - Draft Registrations
      operationId: draft_registration_institutions_relationship_delete
      parameters:
      - name: draft_id
        in: path
        required: true
        description: The unique identifier of the draft registration.
        schema:
          type: string
      responses:
        '204':
          description: Institutions removed successfully.
        '403':
          description: Forbidden. You do not have permission to modify institutions.
        '404':
          description: Draft registration not found.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: array
                  items:
                    type: object
                    required:
                    - type
                    - id
                    properties:
                      type:
                        type: string
                        example: institutions
                        description: The resource type; must be `institutions`.
                      id:
                        type: string
                        example: inst456
                        description: The unique ID of the institution to remove.
        description: JSON:API list of institution identifiers to disassociate from the draft registration.
        required: true
