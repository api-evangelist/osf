                      data:
                        id: 61e02bee90de34000ae344b5
                        type: subjects
                        attributes:
                          text: Arts and Humanities
                          taxonomy_name: ''
                        relationships:
                          parent:
                            data: null
                          children:
                            links:
                              related:
                                href: https://api.osf.io/v2/subjects/61e02bee90de34000ae344b5/children/
                                meta: {}
                        embeds:
                          parent:
                            errors:
