openapi: 3.2.0
info:
  title: OSF APIv2 Documentation Draft Registrations API
  description: This is the official documentation for the OSF (Open Science Framework) API v2.
  version: '2.0'
  termsOfService: https://osf.io/terms_of_use/
  contact:
    name: OSF Support Team
    email: support@osf.io
    url: https://help.osf.io/
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  x-logo:
    url: https://cdn.cos.io/media/images/cos_center_logo_small.original.png
    backgroundColor: transparent
servers:
- url: https://api.test.osf.io/v2
tags:
- name: Draft Registrations
  description: A Draft Registration is a object that allows a user to edit and revise a registration before it is registered. Draft Registrations allow contributors to coordinate on a single registration, so they can upload files and change Registration metadata before the Registration is archived.
paths:
  /nodes/{node_id}/draft_registrations/{draft_id}/:
    get:
      summary: Retrieve a Draft Registration
      description: 'Retrieve the details of a given draft registration.

        Draft Registrations contain Registration questions that will become part of the Registration. A Registration is a frozen version of the project that can never be deleted, but can be withdrawn and have it''s metadata edited.


        Your original project remains editable but will now have the draft registration linked to it.

        #### Permissions

        Only project administrators may view draft registrations.

        #### Returns

        Returns a JSON object with a `data` key containing the representation of the requested draft registration, if the request is successful.


        If the request is unsuccessful, an `errors` key containing information about the failure will be returned. Refer to the list of error codes to understand why this request may have failed.'
      parameters:
      - in: path
        name: node_id
        required: true
        description: The unique identifier of the node.
        schema:
          type: string
      - in: path
        name: draft_id
        required: true
        description: The unique identifier of the draft registration.
        schema:
          type: string
      tags:
      - Draft Registrations
      operationId: nodes_draft_registrations_read
      x-response-schema: Draft Registration
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                title: Draft Registration
                required:
                - id
                - type
                - attributes
                - relationships
                - links
                properties:
                  id:
                    type: string
                    readOnly: true
                    description: The unique identifier of the draft registration entity.
                  type:
                    type: string
                    readOnly: true
                    description: The type identifier of the draft registration entity (`draft_registrations`).
                  attributes:
                    type: object
                    title: Attributes
                    readOnly: false
                    description: The properties of the Draft Registration entity.
                    properties:
                      title:
                        type: string
                        readOnly: false
                        description: The title of the Draft Registration.
                      description:
                        type: string
                        readOnly: false
                        description: The description of the Draft Registration.
                      category:
                        type: string
                        readOnly: false
                        description: The category of the Draft Registration.
                      tags:
                        type: array
                        items:
                          type: string
                        readOnly: false
                        description: The searchable tags of the Draft Registration.
                      node_license:
                        type: object
                        title: Node License
                        properties:
                          copyright_holders:
                            type: array
                            readOnly: false
                            description: A list of names of copyright holders for the license.
                            items:
                              type: string
                              readOnly: true
                              description: A copyright holders for the license.
                          year:
                            type: integer
                            readOnly: false
                            description: The year the copyright was made.
                      current_user_permissions:
                        type: array
                        items:
                          type: string
                        readOnly: true
                        description: The current users permission level for the Draft Registration.
                      has_project:
                        type: boolean
                        readOnly: true
                        description: This indicates whether a Draft Registration was branched from a project.
                      datetime_initiated:
                        type: string
                        format: date-time
                        readOnly: true
                        description: The time at which the draft registration was first initiated, as an iso8601 formatted timestamp.
                      datetime_updated:
                        type: string
                        format: date-time
                        readOnly: true
                        description: The time at which the draft registration was last updated, as an iso8601 formatted timestamp.
                      registration_metadata:
                        type: object
                        readOnly: false
                        description: This is a legacy format for `registration_responses`.
                      registration_responses:
                        type: object
                        readOnly: false
                        description: A dictionary of question IDs and responses from the registration schema.
                  relationships:
                    type: object
                    title: Relationships
                    readOnly: true
                    description: URLs to other entities or entity collections that have a relationship to the draft registration entity.
                    properties:
                      branched_from:
                        type: string
                        readOnly: true
                        description: A link to the node that this draft registration was created from.
                      initiator:
                        type: string
                        readOnly: true
                        description: A link to the user who initiated the draft registration.
                      registration_schema:
                        type: string
                        readOnly: true
                        description: A link to the detailed registration schema that this draft conforms to.
                  links:
                    type: object
                    title: Links
                    readOnly: true
                    required:
                    - html
                    description: URLs to alternative representations of the draft registration entity.
                    properties:
                      html:
                        type: string
                        format: URL
                        readOnly: true
                        description: A link to the draft registration's page on the OSF.
                example:
                  data:
                    type: draft_registrations
                    relationships:
                      registration_schema:
                        data:
                          id: 61e02b6c90de34000ae3447a
                          type: registration_schemas
              example:
                data:
                - id: ''
                  type: draft_registrations
                  attributes:
                    datetime_initiated: ''
                    datetime_updated: ''
                    registration_metadata: {}
                    registration_supplement: ''
                  relationships:
                    branched_from:
                      links:
                        related:
                          href: ''
                          meta: {}
                    initiator:
                      links:
                        related:
                          href: ''
                          meta: {}
                    registration_schema:
                      links:
                        related:
                          href: ''
                          meta: {}
                  links:
                    html: ''
                links:
                  first: ''
                  last: ''
                  prev: ''
                  next: ''
                  meta:
                    total: ''
                    per_page: 10
