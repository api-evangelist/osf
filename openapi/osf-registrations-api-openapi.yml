      summary: Retrieve Subjects Relationship for a Registration
      description: 'Retrieve the relationship data for the subjects associated with a specific registration.

        This endpoint returns an array of subject identifiers in a `relationships` object, without the full subject resource details. To get the full details of the subjects, you should follow the `related` link provided in the relationships object or query the `/registrations/{registration_id}/subjects/` endpoint.

        #### Permissions

        - Public registrations expose this relationship publicly.

        - Private registrations require appropriate permissions to view their subjects.


        #### Returns

        - A JSON object with a `data` key, which contains an array of `subject` resource identifier objects (`id` and `type`).'
      tags:
      - Registrations
      operationId: registration_subjects_relationship_list
      parameters:
      - in: path
        name: registration_id
        required: true
        description: The unique identifier of the registration.
        schema:
          type: string
      responses:
        '200':
          description: Successfully retrieved the subject relationship data for this registration.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: subj123
                          description: The unique identifier of the subject.
                        type:
                          type: string
                          example: subjects
                          description: The type of the related resource (always `subjects` for this endpoint).
                  links:
                    type: object
                    properties:
                      self:
                        type: string
                        example: https://api.osf.io/v2/registrations/{registration_id}/relationships/subjects/
                        description: The link to this relationship view.
                      related:
                        type: string
                        example: https://api.osf.io/v2/registrations/{registration_id}/subjects/
                        description: The link to the related subjects resources.
              example:
                data:
                - id: subj123
                  type: subjects
                - id: subj456
                  type: subjects
                links:
                  self: https://api.osf.io/v2/registrations/abcd1/relationships/subjects/
                  related: https://api.osf.io/v2/registrations/abcd1/subjects/
        '401':
          description: Unauthorized. Authentication is required to access this resource.
        '403':
          description: Forbidden. You do not have permission to access this registration's subjects.
        '404':
          description: Not Found. No registration matches the given ID.
  /registrations/{registration_id}/requests/:
    get:
      summary: List Requests for a Registration
      description: 'Retrieve a list of requests associated with a specific registration.

        Requests allow contributors and moderators to manage changes to a registration, including withdrawal requests, embargo requests, and schema update requests.

        #### Permissions

        - Public registrations expose some request metadata publicly.

        - Private registrations require read access for non-admin contributors.

        - Only admins and moderators can view and manage sensitive request details.


        #### Returns

        - A JSON object with a `data` key containing an array of request records.

        - Each request includes the type of request (withdrawal, embargo, etc.), its state,

        and information about who initiated the request.'
      tags:
      - Registrations
      operationId: registrations_requests_list
      parameters:
      - in: path
        name: registration_id
        required: true
        description: The unique identifier of the registration.
        schema:
          type: string
      - in: query
        name: filter[type]
        description: "Filter requests by type.\nAllowed values:\n  - withdrawal\n  - embargo\n  - schema_update\n"
        schema:
          type: string
      - in: query
        name: page
        description: Page number of results to return (pagination).
        schema:
          type: integer
      responses:
        '200':
          description: Successfully retrieved the list of requests for this registration.
          content:
            application/json:
              example:
                data:
                - id: rq1xyz
                  type: registration_requests
                  attributes:
                    request_type: withdrawal
                    state: pending
                    created: '2024-03-01T12:00:00Z'
                    updated: '2024-03-03T09:00:00Z'
                    comment: Requesting withdrawal due to data errors.
                  relationships:
                    creator:
                      data:
                        type: users
                        id: user123
                    target:
                      data:
                        type: registrations
                        id: reg456
                  links:
                    self: https://api.osf.io/v2/registration_requests/rq1xyz/
                meta:
                  version: '2.0'
        '401':
          description: Unauthorized. Authentication is required to access requests for this registration.
        '403':
          description: Forbidden. You do not have permission to view requests for this registration.
        '404':
          description: Not Found. No registration matches the given ID.
  /registrations/{registration_id}/resources/:
    get:
      summary: List Related Resources for a Registration
      description: 'Retrieve a list of resources associated with a specific registration.

        This endpoint returns a list of nodes, preprints, and other resources that have been explicitly linked to the registration as related resources. These resources help provide additional context, background, or supporting materials for the registration.

        #### Permissions

        - Public registrations expose their related resources publicly.

        - Private registrations require the user to have read access to view related resources.


        #### Returns

        - A JSON object with a `data` key containing an array of related resources.

        - Related resources may include nodes, preprints, and other OSF resources.'
      tags:
      - Registrations
      operationId: registrations_resources_list
      parameters:
      - in: path
        name: registration_id
        required: true
        description: The unique identifier of the registration.
        schema:
          type: string
      - in: query
        name: page
        description: Page number of results to return (pagination).
        schema:
          type: integer
      responses:
        '200':
          description: Successfully retrieved related resources for this registration.
          content:
            application/json:
              example:
                data:
                - id: xyz123
                  type: nodes
                  attributes:
                    title: Supporting Project A
                    description: Dataset related to the registration study
                    public: true
                    date_created: '2024-01-10T10:00:00Z'
                    date_modified: '2024-03-22T15:30:00Z'
                  relationships:
                    contributors:
                      links:
                        related:
                          href: https://api.osf.io/v2/nodes/xyz123/contributors/
                    affiliated_institutions:
                      links:
                        related:
                          href: https://api.osf.io/v2/nodes/xyz123/institutions/
                  links:
                    self: https://api.osf.io/v2/nodes/xyz123/
                meta:
                  version: '2.0'
        '401':
          description: Unauthorized. Authentication is required to access related resources for this registration.
        '403':
          description: Forbidden. You do not have permission to view the related resources for this registration.
        '404':
          description: Not Found. No registration matches the given ID.
  /registrations/{registration_id}/schema_responses/:
    get:
      summary: List Schema Responses for a Registration
      description: 'Retrieve a list of all Schema Responses associated with a specific registration.

        Schema Responses represent the answers provided to a registration schema''s questions. They reflect the current and historical state of responses submitted for the registration.

        A registration can have multiple schema responses over time due to edits or updates, depending on the registration provider''s workflow.

        #### Permissions

        - Publicly accessible for public registrations.

        - Private registrations require appropriate permissions (must be a contributor with read access).


        #### Returns

        - A JSON object with a `data` key containing an array of schema response resources.

        - Each schema response includes its current state, related actions, and the data provided in the registration form.'
      tags:
      - Registrations
      operationId: registrations_schema_responses_list
      parameters:
      - in: path
        name: registration_id
        required: true
        description: The unique identifier of the registration.
        schema:
          type: string
      - in: query
        name: page
        description: Page number of results to view (pagination).
        schema:
          type: integer
      - in: query
        name: filter[state]
        description: Filter schema responses by their state (e.g., `in_progress`, `unapproved`, `approved`, `pending_moderation`).
        schema:
          type: string
      responses:
        '200':
          description: Successfully retrieved list of schema responses for this registration.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      title: Schema Responses
                      required:
                      - type
                      - attributes
                      properties:
                        id:
                          type: string
                          readOnly: true
                          description: The unique identifier of the Schema Response.
                        type:
                          type: string
                          readOnly: false
                          description: The type identifier of the Schema Response (`schema-response`).
                        attributes:
                          type: object
                          title: Attributes
                          readOnly: false
                          description: The properties of the Schema Response.
                          properties:
                            revision_justification:
                              type: string
                              readOnly: false
                              description: A user provided string representing the reason a new Schema Response was needed.
                            date_created:
                              type: integer
                              readOnly: false
                              description: The date the Schema Response was created
                            date_submitted:
                              type: integer
                              readOnly: false
                              description: The date the Schema Response was submitted for approval.
                            date_modified:
                              type: integer
                              readOnly: false
                              description: The date the Schema Response was most recently changed.
                            revision_responses:
                              type: object
                              items:
                                type: object
                                description: 'Revision responses use a custom key value pair where the key is the block key for that the response. For example in the registration response `{"q1": "Answer 1"}` the block key is `q1`.'
                              description: 'A dictionary object representing responses to to the revision where the key is the block key for that the response. For example in the registration response `{"q1": "Answer 1"}` the block key is `q1`..'
                            reviews_state:
                              type: string
                              readOnly: false
                              enum:
                              - initial
                              - in_progress
                              - approved
                              - pending_moderation
                              description: A string that represents Schema Response state. `initial` is the state of a Schema Response on a newly registered Registration, to edit a Schema Response you must create a Schema Response Action that triggers a new submission.
                            is_pending_current_user_approval:
                              type: boolean
                              readOnly: false
                              description: A bool that represents whether the Schema Response needs the current user to approve the state transition.
                            is_original_response:
                              type: boolean
                              readOnly: false
                              description: A bool that represents whether the Schema Response is the original one that was made when the registration was created.
                            updated_response_keys:
                              type: array
                              readOnly: true
                              description: A list of strings which the response keys for Registration Response Blocks that were updated from the previous schema.
                        links:
                          type: object
                          title: Links
                          readOnly: false
                          description: URLs to alternative representations of the Schema Response entity.
                          properties:
                            self:
                              type: string
                              format: URL
                              readOnly: false
                              description: A link to the detail page for a Schema Response.
                        relationships:
                          type: object
                          title: Relationships
                          readOnly: false
                          description: Links to other entities or entity collections that have a relationship to the file entity.
                          properties:
                            actions:
                              type: string
                              format: URL
                              readOnly: false
                              description: A link to the Registration Schema Actions endpoint for this Schema Response.
                            registration:
                              type: string
                              format: URL
                              readOnly: false
                              description: A link to the Registration for this Schema Response.
                            registration_schema:
                              type: string
                              format: URL
                              readOnly: false
                              description: A link to the Registration Schema for this Schema Response.
                            initiated_by:
                              type: string
                              format: URL
                              readOnly: false
                              description: A link to the User who initiated the creation of the Schema Response.
                      example:
                        data:
                          type: schema-responses
                          attributes:
                            revision_justification: I made a mistake.
                            revision_responses:
                              Q1: updated response
              example:
                data:
                - id: sr123
                  type: schema-responses
                  attributes:
                    state: approved
                    date_created: '2024-05-01T12:00:00Z'
                    date_modified: '2024-06-10T09:30:00Z'
                    revision_justification: Updated methodology section for clarity
                  relationships:
                    registration_schema:
                      data:
                        type: registration-schemas
                        id: rs1
                    registration:
                      data:
                        type: registrations
                        id: abcd1
                    current_user_permissions:
                      data:
                      - read
                      - write
                      - admin
                  links:
                    self: https://api.osf.io/v2/schema_responses/sr123/
                meta:
                  version: '2.0'
        '401':
          description: Unauthorized. Authentication is required to access schema responses for a private registration.
        '403':
          description: Forbidden. You do not have permission to view schema responses for this registration.
        '404':
          description: Not Found. No registration matches the given ID.
  /registrations/{registration_id}/subjects/:
    get:
      summary: List Registration Subjects
      description: 'Retrieve a list of taxonomy subjects assigned to a specific registration.

        Subjects represent the topics, disciplines, or areas of research that the registration is categorized under. These subjects help with search, discovery, and classification within the OSF platform.

        #### Permissions

        - Publicly accessible if the registration is public.

        - Private registrations require admin permissions to access.


        #### Returns

        - A JSON object with a `data` key containing an array of subject resources.

        - Each subject describes a taxonomy term, including its name and hierarchical position.'
      tags:
      - Registrations
      operationId: registrations_subjects_list
      parameters:
      - in: path
        name: registration_id
        required: true
        description: The unique identifier of the registration.
        schema:
          type: string
      - in: query
        name: page
        description: Page number of results to view (pagination).
        schema:
          type: integer
      - in: query
        name: filter[text]
        description: Filter subjects by name.
        schema:
          type: string
      responses:
        '200':
          description: Successfully retrieved list of subjects for this registration.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      title: Taxonomy
                      properties:
                        id:
                          type: string
                          readOnly: true
                          description: The identifier of the taxonomy entity.
                        type:
                          type: string
                          readOnly: true
                          description: The type identifier of the taxonomy entity (`taxonomies`).
                        attributes:
                          type: object
                          title: Attributes
                          readOnly: true
                          description: The properties of the taxonomy entity.
                          properties:
                            text:
                              type: string
                              readOnly: true
                              description: The text name of the taxonomy
                            child_count:
                              type: integer
                              readOnly: true
                              description: The number of children this taxonomy contains.
                            parents:
                              type: array
                              items:
                                type: string
                              readOnly: true
                              description: An array of JSON objects containing keys for `text` (name) and `id` (unique identifier) of this taxonomy's parents
                        links:
                          type: object
                          title: Links
                          readOnly: true
                          description: URLs to alternative representations of the taxonomy entity.
                          properties:
                            parents:
                              type: array
                              items:
                                type: string
                              readOnly: true
                              description: An array of links to to this taxonomy's parents. This field is deprecated as of verson 2.4.
                            self:
                              type: string
                              format: URL
                              readOnly: true
                              description: A link to the detail page for the taxonomy.
              example:
                data:
                - id: '1234'
                  type: taxonomy
                  attributes:
                    text: Psychology
                    parent_ids: []
                    child_ids:
                    - '5678'
                    path:
                    - Psychology
                    is_highlighted: true
                  relationships:
                    parent:
                      data: null
                    children:
                      data:
                      - type: taxonomy
                        id: '5678'
                  links:
                    self: https://api.osf.io/v2/taxonomies/1234/
                meta:
                  version: '2.0'
        '401':
          description: Unauthorized. Authentication is required to access subjects for a private registration.
        '403':
          description: Forbidden. You do not have permission to view subjects for this registration.
        '404':
          description: Not Found. No registration matches the given ID.
  /registrations/{registration_id}/view_only_links/:
    get:
      summary: List all view only links
      description: 'A paginated list of view only links created for this registration.

        #### Returns

        Returns a JSON object containing `data` and `links` keys.


        The `data` key contains an array of up to 10 view only links. Each resource in the array is a view only link object.


        The `links` key contains a dictionary of links that can be used for pagination.


        #### Permissions


        View only links on a registration, public or private, are readable and writeable only by users that are administrators on the registration.


        #### Filtering


        You can optionally request that the response only include view only links that match your filters by utilizing the `filter` query parameter, e.g. https://api.osf.io/v2/registrations/wu3a4/view_only_links/?filter[anonymous]=true.


        View Only Links may be filtered based on their `name`, `anonymous` and `date_created` fields. Possible comparison operators include ''gt'' (greater than), ''gte''(greater than or equal to), ''lt'' (less than) and ''lte'' (less than or equal to). The date must be in the format YYYY-MM-DD and the time is optional.'
      parameters:
      - in: path
        name: registration_id
        required: true
        description: The unique identifier of the registration.
        schema:
          type: string
      tags:
      - Registrations
      operationId: registrations_view_only_links_list
      x-response-schema: View Only Link
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  title: view-only-links
                  required:
                  - id
                  - type
                  - attributes
                  - relationships
                  properties:
                    id:
                      type: string
                      readOnly: true
                      description: The unique identifier of the view only link.
                    type:
                      type: string
                      readOnly: true
                      description: The type identifier of the view only link ('view-only-links').
                    attributes:
                      type: object
                      title: Attributes
                      readOnly: true
                      description: The properties of the view only link entity.
                      properties:
                        date_created:
                          type: string
                          format: date-time
                          readOnly: true
                          description: The time at which the view only link was created, as an iso8601 formatted timestamp.
                        anonymous:
                          type: boolean
                          default: true
                          readOnly: false
                          description: Whether or not the view only link has anonymized contributors
                        name:
                          type: string
                          default: Shared project link
                          readOnly: false
                          description: The name of the view only link
                        key:
                          type: string
                          readOnly: true
                          description: The view only key
                    relationships:
                      type: object
                      title: Relationships
                      readOnly: true
                      description: URLs to other entities or entity collections that have a relationship to the view only link entity.
                      required:
                      - nodes
                      - creator
                      properties:
                        nodes:
                          type: string
                          format: URL
                          readOnly: false
                          description: A relationship to the nodes which this view only link gives read-only access to.
                        creator:
                          type: string
                          readOnly: true
                          description: A relationship to the user who created this view only link.
