    patch:
      summary: Update a node
      description: 'Updates a node by setting the values of the attributes specified in the request body. Any unspecified attributes will be left unchanged.


        Nodes can be updated with either a **PUT** or **PATCH** request. The `title` and `category` fields are mandatory in a **PUT** request, and optional in a **PATCH**.

        #### Permissions

        Only write contributors may update a node. Attempting to update a node for which you do not have write access will result in a **403 Forbidden** response.

        #### Returns

        Returns a JSON object with a `data` key containing the new representation of the updated node, if the request is successful.


        If the request is unsuccessful, an `errors` key containing information about the failure will be returned. Refer to the list of error codes to understand why this request may have failed.

        Some common error cases:

        - `405 Method Not Allowed`: Returned if write access to this node has been restricted. The response will include the message "This action is no longer available. Contact support if you have any questions."'
      parameters:
      - in: path
        name: node_id
        required: true
        description: The unique identifier of the node.
        schema:
          type: string
      tags:
      - Nodes
      operationId: nodes_partial_update
      x-response-schema: Node
      responses:
        '200':
          description: OK
        '405':
          description: Returned if write access to this node has been restricted. The response will include the message "This action is no longer available. Contact support if you have any questions."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                data:
                  type: nodes
                  id: '{node_id}'
                  attributes:
                    description: An updated abstract.
                    tags:
                    - cancer biology
                    - reproducibility
                    public: true
        required: true
    delete:
      summary: Delete a node
      description: 'Permanently deletes a node. This action cannot be undone.

        #### Permissions

        Only project administrators may delete a node. Attempting to delete a node for which you are not an administrator will result in a **403 Forbidden** response.

        #### Returns

        If the request is successful, no content is returned.


        If the request is unsuccessful, a JSON object with an `errors` key containing information about the failure will be returned. Refer to the list of error codes to understand why this request may have failed.'
      parameters:
      - in: path
        name: node_id
        required: true
        description: The unique identifier of the node.
        schema:
          type: string
      tags:
      - Nodes
      operationId: nodes_delete
      responses:
        '204':
          description: No content
  /nodes/{node_id}/addons/:
    get:
      summary: List all addons
      description: 'A paginated list of addons connected to the given node or project.

        #### Returns

        Returns a JSON object containing `data` and `links` keys.


        The `data` key contains an array of at most 10 addon objects. Each resource in the array is a separate addon object and contains the full representation of the addon, meaning additional requests to a addon''s detail view are not necessary.


        The `links` key contains a dictionary of links that can be used for pagination.'
      parameters:
      - in: path
        name: node_id
        required: true
        description: The unique identifier of the node.
        schema:
          type: string
      tags:
      - Nodes
      operationId: nodes_addons_list
      x-response-schema: Addon
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  title: Addon
                  properties:
                    attributes:
                      type: object
                      title: Attributes
                      readOnly: true
                      description: The properties of the addon entity.
                      properties:
                        url:
                          type: string
                          readOnly: true
                          description: The URL to the third-party service provider.
                        name:
                          type: string
                          readOnly: true
                          description: The name of the third-party service provider.
                        description:
                          type: string
                          readOnly: true
                          description: The description of the service provider.
                        categories:
                          type: array
                          items:
                            type: string
                            enum:
                            - documentation
                            - storage
                            - bibliography
                            - other
                            - security
                            - citations
                          readOnly: true
                          description: List of categories this addon belongs to.
                    type:
                      type: string
                      readOnly: true
                      description: The type identifier of the addon entity (`addons`).
                    id:
                      type: string
                      readOnly: true
                      description: The identifier of the addon entity.
              example:
                data:
                - links:
                    self: http://api.osf.io/v2/nodes/gaz5n/addons/<provider_id>/
                  attributes:
                    folder_path: null
                    configured: false
                    external_account_id: null
                    folder_id: null
                    node_has_auth: false
                  type: node_addons
                  id: <provider_id>
                - links:
                    self: http://api.osf.io/v2/nodes/gaz5n/addons/<another_provider_id>/
                  attributes:
                    folder_path: null
                    configured: false
                    external_account_id: null
                    folder_id: null
                    node_has_auth: false
                  type: node_addons
                  id: <another_provider_id>
                links:
                  first: null
                  last: null
                  prev: null
                  next: null
                  meta:
                    total: 2
                    per_page: 10
