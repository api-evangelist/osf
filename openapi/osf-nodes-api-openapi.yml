    delete:
      summary: Delete a contributor
      description: 'Removes a contributor from a node. This request only removes the relationship between the node and the user, it does not delete the user itself.


        A node must always have at least one admin, and attempting to remove the only admin from a node will result in a **400 Bad Request** response.

        #### Permissions

        A user can remove themselves as a node contributor. Otherwise, only project administrators can remove contributors.

        #### Returns

        If the request is successful, no content is returned.


        If the request is unsuccessful, a JSON object with an `errors` key containing information about the failure will be returned. Refer to the list of error codes to understand why this request may have failed.

        Some common error cases:

        - `405 Method Not Allowed`: If write access to this node has been restricted, a contributor removing themselves is still permitted, but attempting to remove a different contributor will return this error with the message "This action is no longer available. Contact support if you have any questions."'
      parameters:
      - in: path
        name: node_id
        required: true
        description: The unique identifier of the node.
        schema:
          type: string
      - in: path
        name: user_id
        required: true
        description: The unique identifier of the user.
        schema:
          type: string
      tags:
      - Nodes
      operationId: nodes_contributors_delete
      responses:
        '204':
          description: No content
        '405':
          description: If write access to this node has been restricted, a contributor removing themselves is still permitted, but attempting to remove a different contributor will return this error with the message "This action is no longer available. Contact support if you have any questions."
  /nodes/{node_id}/draft_registrations/:
    get:
      summary: List all draft registrations
      description: 'A paginated list of all of the draft registrations of a given node.


        Draft Registrations contain Registration questions that will become part of the Registration. A Registration is a frozen version of the project that can never be deleted, but can be withdrawn and have it''s metadata edited.


        Your original project remains editable but will now have the draft registration linked to it.

        #### Permissions

        Only project administrators may view draft registrations.

        #### Returns

        Returns a JSON object containing `data` and `links` keys.


