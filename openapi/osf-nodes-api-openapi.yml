        The registration supplement of a draft registration cannot be updated after the draft has been created.


        When updating a draft registration, `registration_metadata` is required. It must be a dictionary with keys as question ids in the registration form, and values as nested dictionaries matching the specific format in the registration schema.


        If a question is multiple-choice, the question response must exactly match one of the possible choices.

