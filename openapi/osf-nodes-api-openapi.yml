  /nodes/{node_id}/identifiers/:
    get:
      summary: Retrieve Identifiers for a Node
      description: 'Retrieve a list of all identifiers (such as DOIs or ARKs) associated with the specified node.

        Identifiers are unique strings that reference the node in external systems. These can include persistent identifiers such as DOIs (Digital Object Identifiers) or ARKs (Archival Resource Keys).

        #### Response Structure

        The response returns a JSON object containing the following top-level keys:


        - `data`: An array of identifier resources.

        - `links`: Pagination links (if applicable).


        Each item in the `data` array is a distinct identifier object, containing details such as the identifier `category` (e.g., `doi`, `ark`), its `value`, and links to the associated node.

        #### Filtering

        You may filter the returned identifiers by category using the `filter[category]` query parameter.

        **Example:**

        Supported filter categories include:

        - `doi` - Digital Object Identifier

        - `ark` - Archival Resource Key


        #### Permissions


        - This endpoint is public for nodes that are public.

        - Authentication is required to access identifiers on private nodes, and the authenticated user must have read access.'
      parameters:
      - in: path
        name: node_id
        required: true
        description: The unique identifier of the node for which you want to retrieve associated identifiers.
        schema:
          type: string
      tags:
      - Nodes
      operationId: nodes_identifiers_list
      x-response-schema: Identifier
      responses:
        '200':
          description: Successful retrieval of identifiers.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  title: Identifier
                  description: Representation of an identifier entity within the OSF API.
                  properties:
                    id:
                      type: string
                      readOnly: true
                      description: Unique identifier for the identifier entity.
                    type:
                      type: string
                      readOnly: true
                      description: Resource type, always `identifiers` for identifier entities.
                    attributes:
                      type: object
                      title: Attributes
                      readOnly: true
                      description: Attributes of the identifier entity, including category and value.
                      properties:
                        category:
                          type: string
                          enum:
                          - doi
                          readOnly: true
                          description: The category of the identifier, such as ARK or DOI.
                        value:
                          type: string
                          readOnly: true
                          description: The actual value of the identifier.
                    relationships:
                      type: object
                      title: Relationships
                      readOnly: true
                      description: Relationships to other entities, indicating the node this identifier refers to.
                      properties:
                        referent:
                          type: object
                          description: Relationship object linking to the node associated with this identifier.
                          properties:
                            links:
                              type: object
                              properties:
                                related:
                                  type: string
                                  format: url
                                  description: URL to the related node.
                    links:
                      type: object
                      title: Links
                      readOnly: true
                      description: Links to representations of the identifier entity.
                      properties:
                        self:
                          type: string
                          format: url
                          readOnly: true
                          description: URL to the detail page for this identifier.
              example:
                data:
                - id: 57f1641db83f6901ed94b459
                  type: identifiers
                  attributes:
                    category: doi
                    value: 10.17605/OSF.IO/73PND
                  relationships:
                    referent:
                      links:
                        related:
                          href: https://api.osf.io/v2/nodes/73pnd/
                          meta: {}
                  links:
                    self: https://api.osf.io/v2/identifiers/57f1641db83f6901ed94b459/
                - id: 57f1641db83f6901ed94b45a
                  type: identifiers
                  attributes:
                    category: ark
                    value: c7605/osf.io/73pnd
                  relationships:
                    referent:
                      links:
                        related:
                          href: https://api.osf.io/v2/nodes/73pnd/
                          meta: {}
                  links:
                    self: https://api.osf.io/v2/identifiers/57f1641db83f6901ed94b45a/
                links:
                  first: null
                  last: null
                  prev: null
                  next: null
                  meta:
                    total: 2
                    per_page: 10
    post:
      summary: Mint a New Identifier for a Node
      description: 'Mint (create) a new identifier for the specified node.

        Currently, the OSF supports minting **DOI** identifiers through this endpoint. Once created, identifiers are permanent and cannot be modified or deleted.

        #### Supported Identifier Categories


        - `doi`: Digital Object Identifier.


        #### Requirements


        - You must have **Admin** or **Write** permissions on the node.

        - The node must be **public** and must **not** be a collection or folder.

        - Only nodes representing individual projects or components are eligible for DOI creation.


        #### Example Request Payload


        ```json

        {

        "data": {

        "type": "identifiers",

        "attributes": {

        "category": "doi"

        }

        }

        }

        ```


        #### Permissions

        - Only authenticated users with the required permissions can mint new identifiers.

        - This endpoint is does not authenticate for nodes that are private or not publicly available.'
      operationId: nodes_identifiers_create
      tags:
      - Nodes
      parameters:
      - in: path
        name: node_id
        required: true
        description: The unique identifier of the node for which you want to create an identifier.
        schema:
          type: string
      responses:
        '201':
          description: Identifier successfully created.
          content:
            application/json:
              schema:
                type: object
                title: Identifier
                description: Representation of an identifier entity within the OSF API.
                properties:
                  id:
                    type: string
                    readOnly: true
                    description: Unique identifier for the identifier entity.
                  type:
                    type: string
                    readOnly: true
                    description: Resource type, always `identifiers` for identifier entities.
                  attributes:
                    type: object
                    title: Attributes
                    readOnly: true
                    description: Attributes of the identifier entity, including category and value.
                    properties:
                      category:
                        type: string
                        enum:
                        - doi
                        readOnly: true
                        description: The category of the identifier, such as ARK or DOI.
                      value:
                        type: string
                        readOnly: true
                        description: The actual value of the identifier.
                  relationships:
                    type: object
                    title: Relationships
                    readOnly: true
                    description: Relationships to other entities, indicating the node this identifier refers to.
                    properties:
                      referent:
                        type: object
                        description: Relationship object linking to the node associated with this identifier.
                        properties:
                          links:
                            type: object
                            properties:
                              related:
                                type: string
                                format: url
                                description: URL to the related node.
                  links:
                    type: object
                    title: Links
                    readOnly: true
                    description: Links to representations of the identifier entity.
                    properties:
                      self:
                        type: string
                        format: url
                        readOnly: true
                        description: URL to the detail page for this identifier.
              example:
                data:
                  id: 57f1641db83f6901ed94b459
                  type: identifiers
                  attributes:
                    category: doi
                    value: 10.17605/OSF.IO/73PND
                  relationships:
                    referent:
                      links:
                        related:
                          href: https://api.osf.io/v2/nodes/73pnd/
                          meta: {}
                  links:
                    self: https://api.osf.io/v2/identifiers/57f1641db83f6901ed94b459/
        '400':
          description: "Bad Request. Possible reasons include:\n - The node already has a DOI identifier.\n - The requested identifier category is not supported (only `doi` is allowed).\n - The node is not eligible for DOI creation (e.g., it's a folder or collection)."
        '403':
          description: "Forbidden. You do not have permission to create identifiers on this node. This may occur if:\n - The node is private.\n - You do not have Admin or Write access to the node."
        '404':
          description: Node not found. Verify the node ID is correct and that you have permission to view the node.
        '405':
          description: Returned if write access to this node has been restricted. The response will include the message "This action is no longer available. Contact support if you have any questions."
