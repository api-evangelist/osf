                          meta: {}
                    node_links:
                      links:
                        related:
                          href: https://api.osf.io/v2/nodes/ezcuj/node_links/
                          meta: {}
                    linked_nodes:
                      links:
                        self:
                          href: https://api.osf.io/v2/nodes/ezcuj/relationships/linked_nodes/
                          meta: {}
