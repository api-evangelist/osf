                        preprint:
                          type: boolean
                          readOnly: true
                          description: Whether or not a preprint has been created from this node, or if this node was created for a preprint.
                        public:
                          type: boolean
                          readOnly: false
                          description: Whether or not the registration is publicly visible.
                        registration:
