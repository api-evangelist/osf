    delete:
      summary: Delete a Collection
      description: 'Deletes a collection, if the user has appropriate permissions.

        #### Permissions

        Users must have write permissions on a collection in order to delete it

        #### Returns

        Nothing is returned in the body'
      parameters:
      - in: path
        required: true
        name: collection_id
        description: A short id for that collection
        schema:
          type: string
      tags:
      - Collections
      operationId: collections_delete
      x-response-schema: Collection
      responses:
        '204':
          description: No Content
  /collections/{collection_id}/linked_nodes:
    get:
      summary: List All Linked Nodes for a Collection
      description: 'List of all nodes linked to the given collection.

        #### Permissions

        This returns all public nodes associated with this collection.

        #### Returns

        Returns a JSON object containing `data` and `links` keys.


        The `data` key contains an array of up to 10 nodes. Each resource in the array is a separate node object.


        The `links` key contains a dictionary of links that can be used for pagination.'
      parameters:
      - in: path
        required: true
        name: collection_id
        description: A short id for that collection
        schema:
          type: string
      tags:
      - Collections
      operationId: collections_linked_nodes_list
      x-response-schema: Collection
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                data:
                - id: 2vewn
                  type: nodes
