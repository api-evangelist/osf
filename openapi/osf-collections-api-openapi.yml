  /collections/{collection_id}/linked_nodes/relationships/:
    post:
      summary: Link Nodes to Collection
      description: 'This endpoint allow users to a add a node to a collection by issuing a POST request.

        #### Permissions

        This returns all public nodes associated with this collection.

        #### Returns

        Returns a JSON object containing `data` and `links` keys.


        The `data` key contains an array of comment objects. Each resource in the array is a separate comment object.


        The `links` key contains a dictionary of links that can be used for pagination.'
      parameters:
      - in: path
        required: true
        name: collection_id
        description: A short id for that collection
        schema:
          type: string
      tags:
      - Collections
      operationId: collections_linked_nodes_relationships
      x-response-schema: Collection
      responses:
        '201':
          description: Created
          content:
            application/json:
              example: null
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                data:
                - type: linked_nodes
                  id: guid0
                - type: linked_nodes
                  id: newid
                - type: linked_nodes
                  id: test2
                - type: linked_nodes
                  id: guid4
        required: true
    get:
      summary: Give a Sparse List of Node Ids
      description: 'List of all the node ids linked to the given collection.

        #### Permissions

        This returns all public nodes associated with this collection.

        #### Returns

        Returns a JSON object containing `data` and `links` keys.


        The `data` key contains an array of nodes ids.

        The `links` key contains a dictionary of links that can be used for pagination.'
      parameters:
      - in: path
        required: true
        name: collection_id
        description: A short id for that collection
        schema:
          type: string
      tags:
      - Collections
      operationId: collections_linked_nodes_relationships_create
      x-response-schema: Collection
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                data:
                - type: nodes
                  id: guid0
