openapi: 3.2.0
info:
  title: OSF APIv2 Documentation Custom Metadata API
  description: This is the official documentation for the OSF (Open Science Framework) API v2.
  version: '2.0'
  termsOfService: https://osf.io/terms_of_use/
  contact:
    name: OSF Support Team
    email: support@osf.io
    url: https://help.osf.io/
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  x-logo:
    url: https://cdn.cos.io/media/images/cos_center_logo_small.original.png
    backgroundColor: transparent
servers:
- url: https://api.test.osf.io/v2
tags:
- name: Custom Metadata
  description: Custom Metadata endpoints allow users to manage freeform or structured metadata associated with OSF nodes and files. Unlike CEDAR metadata, Custom Metadata provides more flexible fields tailored to specific research needs or institutional requirements. Users can create, view, and edit metadata records that describe files or items in OSF, including funder information, language, resource type, and more.
paths:
  /custom_file_metadata_records/{file_id}/:
    get:
      summary: Retrieve custom file metadata for a file
      description: Retrieve a custom file metadata record associated with a specific file by its GUID. Custom file metadata includes fields such as title, description, language, and funding information.
      operationId: getCustomFileMetadataRecord
      tags:
      - Custom Metadata
      parameters:
      - name: file_id
        in: path
        description: The unique identifier of the file.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successfully retrieved custom file metadata record.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - type
                    - attributes
                    properties:
                      type:
                        type: string
                        description: The resource type.
                        example: custom-file-metadata-records
                      attributes:
                        type: object
                        properties:
                          title:
                            type: string
                            description: The title of the file.
                            example: My Dataset File
                          description:
                            type: string
                            description: A description of the file.
                            example: This file contains raw data collected from fieldwork.
                          language:
                            type: string
                            description: The language of the content.
                            example: en
                          resource_type_general:
                            type: string
                            description: The general type of the resource.
                            example: Dataset
                          funders:
                            type: array
                            description: Information about funding sources.
                            items:
                              type: object
                              required:
                              - funder_name
                              properties:
                                funder_name:
                                  type: string
                                  example: National Science Foundation
                                funder_identifier:
                                  type: string
                                  example: '123456'
                                funder_identifier_type:
                                  type: string
                                  enum:
                                  - ISNI
                                  - GRID
                                  - Crossref Funder ID
                                  - ROR
                                  - Other
                                  example: ROR
                                award_number:
                                  type: string
                                  example: NSF-1234
                                award_uri:
                                  type: string
                                  example: https://nsf.gov/awardsearch/showAward?AWD_ID=1234
                                award_title:
                                  type: string
                                  example: Climate Change Research Grant
        '401':
          description: Authentication credentials were not provided or are invalid.
        '403':
          description: You do not have permission to access this metadata record.
        '404':
          description: Metadata record not found.
    patch:
      summary: Update custom file metadata for a file
      description: Update an existing custom file metadata record. Editable fields include title, description, language, resource type, and funding information.
      operationId: updateCustomFileMetadataRecord
      tags:
      - Custom Metadata
      parameters:
      - name: file_id
        in: path
        description: The unique identifier of the file.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successfully updated custom file metadata record.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - type
                    - attributes
                    properties:
                      type:
                        type: string
                        description: The resource type.
                        example: custom-file-metadata-records
                      attributes:
                        type: object
                        properties:
                          title:
                            type: string
                            description: The title of the file.
                            example: My Dataset File
                          description:
                            type: string
                            description: A description of the file.
                            example: This file contains raw data collected from fieldwork.
                          language:
                            type: string
                            description: The language of the content.
                            example: en
                          resource_type_general:
                            type: string
                            description: The general type of the resource.
                            example: Dataset
                          funders:
                            type: array
                            description: Information about funding sources.
                            items:
                              type: object
                              required:
                              - funder_name
                              properties:
                                funder_name:
                                  type: string
                                  example: National Science Foundation
                                funder_identifier:
                                  type: string
                                  example: '123456'
                                funder_identifier_type:
                                  type: string
                                  enum:
                                  - ISNI
                                  - GRID
                                  - Crossref Funder ID
                                  - ROR
                                  - Other
                                  example: ROR
                                award_number:
                                  type: string
                                  example: NSF-1234
                                award_uri:
                                  type: string
                                  example: https://nsf.gov/awardsearch/showAward?AWD_ID=1234
                                award_title:
                                  type: string
                                  example: Climate Change Research Grant
        '400':
          description: Validation error or invalid data.
        '401':
          description: Authentication credentials were not provided or are invalid.
        '403':
          description: You do not have permission to modify this metadata record.
        '404':
          description: Metadata record not found.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  required:
                  - type
                  - attributes
                  properties:
                    type:
                      type: string
                      description: The resource type.
                      example: custom-file-metadata-records
                    attributes:
                      type: object
                      properties:
                        title:
                          type: string
                          description: The title of the file.
                          example: My Dataset File
                        description:
                          type: string
                          description: A description of the file.
                          example: This file contains raw data collected from fieldwork.
                        language:
                          type: string
                          description: The language of the content.
                          example: en
                        resource_type_general:
                          type: string
                          description: The general type of the resource.
                          example: Dataset
                        funders:
                          type: array
                          description: Information about funding sources.
                          items:
                            type: object
                            required:
                            - funder_name
                            properties:
                              funder_name:
                                type: string
                                example: National Science Foundation
                              funder_identifier:
                                type: string
                                example: '123456'
                              funder_identifier_type:
                                type: string
                                enum:
                                - ISNI
                                - GRID
                                - Crossref Funder ID
                                - ROR
                                - Other
                                example: ROR
                              award_number:
                                type: string
                                example: NSF-1234
                              award_uri:
                                type: string
                                example: https://nsf.gov/awardsearch/showAward?AWD_ID=1234
                              award_title:
                                type: string
                                example: Climate Change Research Grant
        description: Custom file metadata record object.
        required: true
