openapi: 3.2.0
info:
  title: OSF APIv2 Documentation Collection Submissions API
  description: This is the official documentation for the OSF (Open Science Framework) API v2.
  version: '2.0'
  termsOfService: https://osf.io/terms_of_use/
  contact:
    name: OSF Support Team
    email: support@osf.io
    url: https://help.osf.io/
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  x-logo:
    url: https://cdn.cos.io/media/images/cos_center_logo_small.original.png
    backgroundColor: transparent
servers:
- url: https://api.test.osf.io/v2
tags:
- name: Collection Submissions
  description: A Collection Submission is an object that allows a user to add a resource, either a project, preprint, or registration to a collection.
paths:
  /providers/registrations/{provider_id}/submissions/:
    get:
      summary: List Submissions for a Registration
      description: 'Retrieve a list of submissions associated with a specific registration.

        A submission represents an attempt to add a registration to a collection, typically requiring moderation or approval.

        #### Permissions - Only authenticated users with access to the registration can view submission data. - Access to submission details may depend on the moderation settings of the related collections.

        #### Returns - A JSON object with a `data` key containing an array of submission objects. - Each submission reflects its current moderation status and relevant metadata.'
      tags:
      - Collection Submissions
      operationId: registrations_submissions_list
      parameters:
      - in: path
        name: provider_id
        required: true
        description: The unique identifier of the registration.
        schema:
          type: string
      - in: query
        name: filter[state]
        required: false
        description: 'Filter submissions by their state.

          Available values:

          - in_progress

          - pending

          - accepted

          - rejected

          - removed

          '
        schema:
          type: string
      - in: query
        name: page
        required: false
        description: Page number of results to return (pagination).
        schema:
          type: integer
      - in: query
        name: per_page
        required: false
        description: Number of results per page (default 10, maximum 100).
        schema:
          type: integer
      responses:
        '200':
          description: Successful retrieval of the list of submissions for the registration.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - type
                      - attributes
                      - relationships
                      - links
                      properties:
                        id:
                          type: string
                          example: sub1
                        type:
                          type: string
                          example: collection-submissions
                        attributes:
                          type: object
                          required:
                          - state
                          - date_submitted
                          properties:
                            state:
                              type: string
                              enum:
                              - in_progress
                              - pending
                              - accepted
                              - rejected
                              - removed
                              example: pending
                            date_submitted:
                              type: string
                              format: date-time
                              example: '2024-12-01T12:00:00Z'
                        relationships:
                          type: object
                          required:
                          - collection
                          - creator
                          properties:
                            collection:
                              type: object
                              properties:
                                data:
                                  type: object
                                  properties:
                                    type:
                                      type: string
                                      example: collections
                                    id:
                                      type: string
                                      example: col123
                            creator:
                              type: object
                              properties:
                                data:
                                  type: object
                                  properties:
                                    type:
                                      type: string
                                      example: users
                                    id:
                                      type: string
                                      example: user456
                        links:
                          type: object
                          properties:
                            self:
                              type: string
                              example: https://api.test.osf.io/v2/collection_submissions/sub1/
                  links:
                    type: object
                    properties:
                      self:
                        type: string
                      next:
                        type: string
                        description: Link to the next page of results, if applicable.
                      prev:
                        type: string
                        description: Link to the previous page of results, if applicable.
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
                        description: Total number of submissions.
                      per_page:
                        type: integer
                        description: Number of submissions per page.
                      version:
                        type: string
                        description: API version.
              example:
                data:
                - id: sub1
                  type: collection-submissions
                  attributes:
                    state: pending
                    date_submitted: '2024-12-01T12:00:00Z'
                  relationships:
                    collection:
                      data:
                        type: collections
                        id: col123
                    creator:
                      data:
                        type: users
                        id: user456
                  links:
                    self: https://api.test.osf.io/v2/collection_submissions/sub1/
                - id: sub2
                  type: collection-submissions
                  attributes:
                    state: accepted
                    date_submitted: '2024-10-15T10:00:00Z'
                  relationships:
                    collection:
                      data:
                        type: collections
                        id: col456
                    creator:
                      data:
                        type: users
                        id: user456
                  links:
                    self: https://api.test.osf.io/v2/collection_submissions/sub2/
                links:
                  self: https://api.test.osf.io/v2/registrations/abcd1/submissions/
                  next: null
                  prev: null
                meta:
                  total: 2
                  per_page: 10
                  version: '2.0'
        '401':
          description: Unauthorized. Authentication is required to access these submissions.
        '403':
          description: Forbidden. You do not have permission to view these submissions.
        '404':
          description: Not Found. No registration matches the given ID.
  /collection_submissions/{collection_submission_id}/actions/:
    get:
      summary: Get a list of Collection Submission Actions for a Collection Submission
      description: 'This returns a list of the actions that have changed the Collection Submission moderation state.

        #### Permissions

        This information is only available to an admin or moderator of a Collection when it is private, however if the Collection is public the data is available to all.

        #### Returns

        Returns a JSON object containing `data` and `links` keys.

        The `data` key contains an array of nodes ids.

        The `links` key contains a dictionary of links that can be used for pagination.'
      parameters:
      - in: path
        required: true
        name: collection_submission_id
        description: A short id for that collection submission
        schema:
          type: string
      tags:
      - Collection Submissions
      operationId: collection_submission_list
      x-response-schema: Collection Submissions
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                data:
                - id: 63bc18c66f4506000abae96f
                  type: collection-submission-actions
                  attributes:
                    trigger: remove
                    from_state: accepted
                    to_state: removed
                    comment: test remove!
                    date_created: '2023-01-09T13:38:14.598839Z'
                    date_modified: '2023-01-09T13:38:14.598867Z'
                  relationships:
                    collection:
                      links:
                        related:
                          href: https://api.staging.osf.io/v2/collections/3vpkf/
                          meta: {}
                      data:
                        id: 3vpkf
                        type: collections
                    creator:
                      links:
                        related:
                          href: https://api.staging.osf.io/v2/users/zpw9n/
                          meta: {}
                      data:
                        id: zpw9n
                        type: users
                    target:
                      links:
                        related:
                          href: https://api.staging.osf.io/v2/collections/3vpkf/collection_submissions/xhwz7/
                          meta: {}
                      data:
                        id: xhwz7-3vpkf
                        type: collection-submission
                  links:
                    self: https://api.staging.osf.io/v2/actions/63bc18c66f4506000abae96f/
