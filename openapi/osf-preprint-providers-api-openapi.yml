openapi: 3.2.0
info:
  title: OSF APIv2 Documentation Preprint Providers API
  description: This is the official documentation for the OSF (Open Science Framework) API v2.
  version: '2.0'
  termsOfService: https://osf.io/terms_of_use/
  contact:
    name: OSF Support Team
    email: support@osf.io
    url: https://help.osf.io/
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  x-logo:
    url: https://cdn.cos.io/media/images/cos_center_logo_small.original.png
    backgroundColor: transparent
servers:
- url: https://api.test.osf.io/v2
tags:
- name: Preprint Providers
  description: Preprint Providers are entities that manage and moderate groups of preprints on the OSF platform.
paths:
  /providers/preprints/:
    get:
      summary: List all preprint providers
      description: 'A paginated list of all preprint providers. The returned preprint providers are sorted by their creation date, with the most recent preprints appearing first.

        #### Returns

        Returns a JSON object containing `data` and `links` keys.


        The `data` key contains an array of 10 preprint providers. Each resource in the array is a separate preprint provider object.


        The `links` key contains a dictionary of links that can be used for pagination.


        This request should never return an error.

        #### Filtering

        You can optionally request that the response only include preprint providers that match your filters by utilizing the `filter` query parameter, e.g. https://api.osf.io/v2/providers/preprints/?filter[id]=osf.


        Preprint Providers may be filtered by their `id`, `name`, and `description`'
      tags:
      - Preprint Providers
      operationId: preprint_provider_list
      x-response-schema: Preprint Provider
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                title: Preprint Providers
                properties:
                  id:
                    type: string
                    readOnly: true
                    description: The identifier of the preprint provider entity.
                  type:
                    type: string
                    readOnly: true
                    description: The type identifier of the preprint provider entity (`preprint_providers`).
                  attributes:
                    type: object
                    title: Attributes
                    readOnly: true
                    description: The properties of the preprint provider entity.
                    properties:
                      social_instagram:
                        type: string
                        readOnly: true
                        description: The preprint provider's Instagram account ID. This field is deprecated as of verson 2.4.
                      advisory_board:
                        type: string
                        readOnly: true
                        description: The HTML representation of the preprint provider's advisory board.
                      email_support:
                        type: string
                        readOnly: true
                        description: The preprint providers's support email address.
                      banner_path:
                        type: string
                        readOnly: true
                        description: A static path to the preprint provider's banner image. This field is deprecated as of verson 2.4.
                      logo_path:
                        type: string
                        readOnly: true
                        description: A static path to the preprint provider's logo image. This field is deprecated as of verson 2.4.
                      subjects_acceptable:
                        type: string
                        readOnly: true
                        description: A nested array structure defining allowed subjects for this preprint provider, in the BePress taxonomy.
                      description:
                        type: string
                        readOnly: true
                        description: The description of the preprint provider.
                      social_facebook:
                        type: string
                        readOnly: true
                        description: The preprint provider's Facebook account ID. This field is deprecated as of verson 2.4.
                      email_contact:
                        type: string
                        readOnly: true
                        description: The preprint provider's contact email address. This field is deprecated as of verson 2.4.
                      example:
                        type: string
                        readOnly: true
                        description: The GUID for an example preprint from this preprint provider.
                      name:
                        type: string
                        readOnly: true
                        description: The name of the preprint provider.
                      domain:
                        type: string
                        readOnly: true
                        description: The preprint provider's domain, if the provider is using a domain to for their preprint service.
                      domain_redirect_enabled:
                        type: boolean
                        readOnly: true
                        description: Whether or not redirects are enabled for the provider's domain.
                  relationships:
                    type: object
                    title: Relationships
                    readOnly: true
                    description: Links to other entities or entity collections that have a relationship to the preprint provider.
                    properties:
                      licenses_acceptable:
                        type: string
                        format: URL
                        readOnly: true
                        description: A link to licenses the preprint provider allows.
                      taxonomies:
                        type: string
                        format: URL
                        readOnly: true
                        description: A link to the taxonomies the preprint provider allows.
                      preprints:
                        type: string
                        readOnly: true
                        description: A link to the preprint list page for the preprint provider.
                  links:
                    type: object
                    title: Links
                    readOnly: true
                    description: Links to alternative representations of the preprint entity.
                    properties:
                      external_url:
                        type: string
                        format: URL
                        readOnly: true
                        description: A link to the external website for the preprint provider.
                      preprints:
                        type: string
                        format: URL
                        readOnly: true
                        description: A link to the preprint list page for the preprint provider.
                      self:
                        type: string
                        format: URL
                        readOnly: true
                        description: A link to the detail page for the preprint provider.
              example:
                data:
                - relationships:
                    licenses_acceptable:
                      links:
                        related:
                          href: https://api.osf.io/v2/providers/preprints/osf/licenses/
                          meta: {}
                    taxonomies:
                      links:
                        related:
                          href: https://api.osf.io/v2/providers/preprints/osf/taxonomies/
                          meta: {}
                    preprints:
                      links:
                        related:
                          href: https://api.osf.io/v2/providers/preprints/osf/preprints/
                          meta: {}
                  links:
                    self: https://api.osf.io/v2/providers/preprints/osf/
                    preprints: https://api.osf.io/v2/providers/preprints/osf/preprints/
                    external_url: https://osf.io/preprints/
                  attributes:
                    social_instagram: ''
                    advisory_board: ''
                    email_support: ''
                    banner_path: /static/img/providers/preprints/cos-logo.png
                    logo_path: /static/img/providers/preprints/cos-logo.png
                    subjects_acceptable: []
                    description: A scholarly commons to connect the entire research cycle
                    social_facebook: ''
                    header_text: ''
                    social_twitter: ''
                    email_contact: ''
                    example: khbvy
                    name: Open Science Framework
                    domain: osf.io
                  type: preprint_providers
                  id: osf
  /providers/preprints/{provider_id}/:
    get:
      summary: Retrieve a preprint provider
      description: 'Retrieves the details of a preprint provider.

        #### Returns

        Returns a JSON object with a `data` key containing the representation of the requested preprint provider, if the request is successful.


        If the request is unsuccessful, an `errors` key containing information about the failure will be returned. Refer to the list of error codes to understand why this request may have failed.


        #### Acceptable Subjects Structure

        Each preprint provider specifies acceptable subjects.

        `subjects_acceptable` is an array found in `attributes`.

        Subjects consist of general parent subjects (e.g., Engineering), more specific child subjects (e.g., Aerospace Engineering), and even more specific grandchild subjects (e.g., Aerodynamics and Fluid Mechanics). Subjects can only be nested 3 deep.


        "subjects_acceptable": [

        [

        [

        # Parent Subject:

        # Architecture

        "584240d954be81056ceca9e5",


        # Child Subject:

        # Architectural Engineering

        "584240da54be81056cecac87"

        ],

        # Include all Architectural Engineering''s children:

        true

        ],

        [

        [

        # Parent Subject:

        # Engineering

        "584240da54be81056cecaca9",


        # Child Subject:

        # Aerospace Engineering

        "584240db54be81056cecacd6",


        # Grandchild Subject:

        # Aerodynamics and Fluid Mechanics

        "584240da54be81056cecaa74"

        ],

        # All nestings 3 deep must be false

        false

        ]

        ]


        The above structure would allow Architecture, Architectural Engineering, all of Architectural Engineering''s children, Engineering, Aerospace Engineering, and Aerodynamics and Fluid Mechanics.'
      parameters:
      - in: path
        required: true
        name: provider_id
        description: The unique identifier of the preprint provider.
        schema:
          type: string
      tags:
      - Preprint Providers
      operationId: preprint_provider_detail
      x-response-schema: Preprint Provider
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                title: Preprint Providers
                properties:
                  id:
                    type: string
                    readOnly: true
                    description: The identifier of the preprint provider entity.
                  type:
                    type: string
                    readOnly: true
                    description: The type identifier of the preprint provider entity (`preprint_providers`).
                  attributes:
                    type: object
                    title: Attributes
                    readOnly: true
                    description: The properties of the preprint provider entity.
                    properties:
                      social_instagram:
                        type: string
                        readOnly: true
                        description: The preprint provider's Instagram account ID. This field is deprecated as of verson 2.4.
                      advisory_board:
                        type: string
                        readOnly: true
                        description: The HTML representation of the preprint provider's advisory board.
                      email_support:
                        type: string
                        readOnly: true
                        description: The preprint providers's support email address.
                      banner_path:
                        type: string
                        readOnly: true
                        description: A static path to the preprint provider's banner image. This field is deprecated as of verson 2.4.
                      logo_path:
                        type: string
                        readOnly: true
                        description: A static path to the preprint provider's logo image. This field is deprecated as of verson 2.4.
                      subjects_acceptable:
                        type: string
                        readOnly: true
                        description: A nested array structure defining allowed subjects for this preprint provider, in the BePress taxonomy.
                      description:
                        type: string
                        readOnly: true
                        description: The description of the preprint provider.
                      social_facebook:
                        type: string
                        readOnly: true
                        description: The preprint provider's Facebook account ID. This field is deprecated as of verson 2.4.
                      email_contact:
                        type: string
                        readOnly: true
                        description: The preprint provider's contact email address. This field is deprecated as of verson 2.4.
                      example:
                        type: string
                        readOnly: true
                        description: The GUID for an example preprint from this preprint provider.
                      name:
                        type: string
                        readOnly: true
                        description: The name of the preprint provider.
                      domain:
                        type: string
                        readOnly: true
                        description: The preprint provider's domain, if the provider is using a domain to for their preprint service.
                      domain_redirect_enabled:
                        type: boolean
                        readOnly: true
                        description: Whether or not redirects are enabled for the provider's domain.
                  relationships:
                    type: object
                    title: Relationships
                    readOnly: true
                    description: Links to other entities or entity collections that have a relationship to the preprint provider.
                    properties:
                      licenses_acceptable:
                        type: string
                        format: URL
                        readOnly: true
                        description: A link to licenses the preprint provider allows.
                      taxonomies:
                        type: string
                        format: URL
                        readOnly: true
                        description: A link to the taxonomies the preprint provider allows.
                      preprints:
                        type: string
                        readOnly: true
                        description: A link to the preprint list page for the preprint provider.
                  links:
                    type: object
                    title: Links
                    readOnly: true
                    description: Links to alternative representations of the preprint entity.
                    properties:
                      external_url:
                        type: string
                        format: URL
                        readOnly: true
                        description: A link to the external website for the preprint provider.
                      preprints:
                        type: string
                        format: URL
                        readOnly: true
