                          meta: {}
                  links:
                    self: https://api.staging.osf.io/v2/providers/collections/characterlab/
  /providers/collections/{provider_id}/licenses/:
    get:
      summary: Collections Providers Licenses List
      description: 'This returns the lists of possible licenses for a Collection.

        #### Permissions

        This information is public.

        #### Returns

        Returns a JSON object containing `data` and `links` keys.

        The `data` key contains an array of license ids.

        The `links` key contains a dictionary of links that can be used for pagination.'
      parameters:
      - in: path
        required: true
        name: provider_id
        description: A short id for that collection
        schema:
          type: string
      tags:
      - Collection Providers
      operationId: getProvidersCollectionsByProviderIdLicenses
      x-response-schema: Collection Provider
      responses:
        '200':
          description: OK
          content:
            application/json:
