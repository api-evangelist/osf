  /preprints/{preprint_id}/contributors/:
    get:
      summary: List all Contributors for a Preprint
      description: 'A paginated list of the Preprint''s Contributors, sorted by their index.


        Contributors are users who can make changes to the Preprint. Contributors with WRITE permissions may edit preprint details, and ADMIN Contributors may add or remove other Contributors.


        Contributors are categorized as either "bibliographic" or "non-bibliographic". From a permissions standpoint, both are the same, but bibliographic contributors are included in citations and are listed on the project overview page on the OSF, while non-bibliographic contributors are not.


        Note that if an anonymous view_only key is being used to view the list of Contributors, the user relationship will not be exposed and the Contributor ID will be an empty string.


        #### Returns

        Returns a JSON object containing `data` and `links` keys.


        The `data` key contains an array of 10 contributors. Each resource in the array contains the full representation of the contributor, meaning additional requests to a contributor''s detail view are not necessary. Additionally, the full representation of the user this contributor represents is automatically embedded within the `data` key of the response.


        The `links` key contains a dictionary of links that can be used for pagination.

        #### Filtering

        You can optionally request that the response only include contributors that match your filters by utilizing the `filter` query parameter, e.g. https://api.osf.io/v2/preprints/y9jdt/contributors/?filter[bibliographic]=true.


        Contributors may be filtered by their `bibliographic` and `permission` attributes.'
      parameters:
      - in: path
        name: preprint_id
        required: true
        description: The unique identifier of the preprint.
        schema:
          type: string
      tags:
      - Preprints
      operationId: preprints_contributors_list
      x-response-schema: Contributor
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  title: Contributor
                  required:
                  - type
                  - relationships
                  properties:
                    id:
                      type: string
                      readOnly: true
                      description: The identifier of the contributor entity. Contributor identifiers have the form {preprint_id}-{user_id}.
                    type:
                      type: string
                      readOnly: true
                      description: The type identifier of the contributor entity (`contributors`).
                    attributes:
                      type: object
                      title: Attributes
                      readOnly: false
                      description: The properties of the contributor entity.
                      properties:
                        bibliographic:
                          type: boolean
                          readOnly: false
                          description: Whether or not the contributor will be included in citations for the Preprint. The default value is true.
                        index:
                          type: integer
                          readOnly: false
                          description: The position of this contributor in the list of Preprint's contributors and in a Preprint's citations.
                        permission:
                          type: string
                          enum:
                          - read
                          - write
                          - admin
                          readOnly: false
                          description: The permission level of the contributor. The default value is 'write'.
                        unregistered_contributor:
                          type: string
                          readOnly: true
                          description: The assigned name of the contributor if the contributor has not yet claimed their account.
                    relationships:
                      type: object
                      title: Relationships
                      readOnly: true
                      description: URLs to other entities or entity collections that have a relationship to the contributor entity.
                      required:
                      - node
                      - user
                      properties:
                        node:
                          type: string
                          readOnly: true
                          description: A relationship to the node that was created for the preprint, or from which the preprint was created.
                        user:
                          type: string
                          readOnly: false
                          description: A relationship to the file that is designated as the preprint's primary file, or the manuscript of the preprint.
                    links:
                      type: object
                      title: Links
                      readOnly: true
                      description: URLs to alternative representations of the contributor entity.
                      properties:
                        self:
                          type: string
                          format: URL
                          readOnly: true
                          description: A link to the the canonical API endpoint for the contributor.
              example:
                data:
                - id: bg8v7-fgvc6
                  type: contributors
                  attributes:
                    index: 0
                    bibliographic: true
                    permission: admin
                    unregistered_contributor: null
                  relationships:
                    users:
                      links:
                        related:
                          href: https://api.osf.io/v2/users/fgvc6/
                          meta: {}
                      data:
                        id: fgvc6
                        type: users
                    preprint:
                      links:
