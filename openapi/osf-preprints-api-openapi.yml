                          type: string
                          description: The name of the storage provider.
                          example: osfstorage
                        type:
                          type: string
                          example: storage-providers
                        attributes:
                          type: object
                          properties:
                            name:
                              type: string
                              description: The name of the storage provider.
                              example: osfstorage
                            default:
                              type: boolean
                              description: Whether this provider is the default.
                              example: true
                        links:
                          type: object
                          properties:
                            upload:
                              type: string
                              description: Upload URL for this storage provider.
                            files:
                              type: string
                              description: Link to files within this storage provider.
                example:
                  data:
                  - id: osfstorage
                    type: storage-providers
                    attributes:
                      name: osfstorage
                      default: true
                    links:
                      upload: https://files.osf.io/v1/resources/abc12/providers/osfstorage/
                      files: https://api.osf.io/v2/preprints/abc12/files/osfstorage/
        '401':
          description: Unauthorized. Authentication is required.
        '403':
          description: Forbidden. You do not have permission to view storage providers for this preprint.
        '404':
          description: Not Found. No preprint matches the given ID.
  /preprints/{preprint_id}/files/osfstorage/:
    get:
      summary: List files for a preprint in osfstorage
      description: 'Retrieve a list of files stored in the `osfstorage` provider for the specified preprint. Only "osfstorage" is available for preprints.

        #### Permissions

        - Public files are accessible to unauthenticated users.

        - Viewing non-public files requires appropriate permissions.'
      tags:
      - Preprints
      operationId: preprint_files_list
      parameters:
      - name: preprint_id
        in: path
        required: true
        description: The unique identifier of the preprint.
        schema:
          type: string
      responses:
        '200':
          description: Successful retrieval of files in osfstorage.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - type
                      - attributes
                      - links
                      properties:
                        id:
                          type: string
                          description: The ID of the file.
                          example: 5b8df35e8c7d2e001d6fa3f9
                        type:
                          type: string
                          example: files
                        attributes:
                          type: object
                          properties:
                            name:
                              type: string
                              description: The name of the file.
                              example: paper.pdf
                            kind:
                              type: string
                              description: Type of the file object ('file' or 'folder').
                              example: file
                            size:
                              type: integer
                              description: Size of the file in bytes.
                              example: 102400
                            modified:
                              type: string
                              format: date-time
                              description: Last modified date of the file.
                              example: '2023-09-01T12:00:00Z'
                            contentType:
                              type: string
                              description: MIME type of the file.
                              example: application/pdf
                        links:
                          type: object
                          properties:
                            download:
                              type: string
                              description: URL to download the file.
                            upload:
                              type: string
                              description: URL to upload new versions of the file.
                example:
                  data:
                  - id: 5b8df35e8c7d2e001d6fa3f9
                    type: files
                    attributes:
                      name: paper.pdf
                      kind: file
                      size: 102400
                      modified: '2023-09-01T12:00:00Z'
                      contentType: application/pdf
                    links:
                      download: https://files.osf.io/v1/resources/abc12/providers/osfstorage/5b8df35e8c7d2e001d6fa3f9
                      upload: https://files.osf.io/v1/resources/abc12/providers/osfstorage/5b8df35e8c7d2e001d6fa3f9
        '401':
          description: Unauthorized. Authentication is required.
        '403':
          description: Forbidden. You do not have permission to view these files.
        '404':
          description: Not Found. No preprint matches the given ID.
  /preprints/{preprint_id}/identifiers/:
    get:
      summary: List identifiers for a preprint
      description: 'Retrieves a list of identifiers associated with the specified preprint. Identifiers include DOIs, ARKs, and other unique resource locators.

        #### Permissions

        - Public identifiers are accessible to unauthenticated users.

        - Private preprints require read access to view their identifiers.'
      tags:
      - Preprints
      operationId: preprint_identifiers_list
      parameters:
      - name: preprint_id
        in: path
        required: true
        description: The unique identifier of the preprint.
        schema:
          type: string
      responses:
        '200':
          description: Successful retrieval of preprint identifiers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - type
                      - attributes
                      properties:
                        id:
                          type: string
                          description: The identifier value itself.
                          example: doi:10.1234/osf.io/abcde
                        type:
                          type: string
                          description: The type of this resource object.
                          example: identifiers
                        attributes:
                          type: object
                          required:
                          - category
                          - value
                          properties:
                            category:
                              type: string
                              description: The category of the identifier (e.g., DOI, ARK).
                              example: doi
                            value:
                              type: string
                              description: The identifier value.
                              example: 10.1234/osf.io/abcde
                  links:
                    type: object
                    description: Links for pagination and resource access.
                    properties:
                      self:
                        type: string
                        description: Link to the current page of results.
                      next:
                        type: string
                        description: Link to the next page of results (if available).
                      prev:
                        type: string
                        description: Link to the previous page of results (if available).
                example:
                  data:
                  - id: doi:10.1234/osf.io/abcde
                    type: identifiers
                    attributes:
                      category: doi
                      value: 10.1234/osf.io/abcde
                  - id: ark:/12345/osf.io/xyz12
                    type: identifiers
                    attributes:
                      category: ark
                      value: ark:/12345/osf.io/xyz12
                  links:
                    self: https://api.osf.io/v2/preprints/abc12/identifiers/
                    next: null
                    prev: null
        '401':
          description: Unauthorized. Authentication is required.
        '403':
          description: Forbidden. You do not have permission to view identifiers for this preprint.
        '404':
          description: Not Found. No preprint matches the given ID.
  /preprints/{preprint_id}/relationships/node/:
    get:
      summary: Retrieve the relationship to the supplemental node of the preprint
      description: 'Retrieve a relationship object that points to the supplemental node associated with this preprint.

        #### Permissions

        - Public preprints will return their supplemental node if it exists.

        - Private preprints require the user to have read access.'
      tags:
      - Preprints
      operationId: preprint_node_relationship_read
      parameters:
      - name: preprint_id
        in: path
        required: true
        description: The unique identifier of the preprint.
        schema:
          type: string
      responses:
        '200':
          description: Successful retrieval of the node relationship.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    description: Relationship to the supplemental node. Will be `null` if no node is linked.
                    type: object
                    required:
                    - id
                    - type
                    properties:
                      id:
                        type: string
                        description: The ID of the related node.
                      type:
                        type: string
                        example: nodes
                  links:
                    type: object
                    properties:
                      self:
                        type: string
                        description: Link to this relationship.
                      related:
                        type: string
                        description: Link to the related node resource.
              example:
                data:
                  id: abc12
                  type: nodes
                links:
                  self: https://api.osf.io/v2/preprints/abc12/relationships/node/
                  related: https://api.osf.io/v2/preprints/abc12/node/
        '401':
          description: Unauthorized. Authentication is required.
        '403':
          description: Forbidden. You do not have permission to view the supplemental node.
        '404':
          description: Not Found. No preprint matches the given ID.
    patch:
      summary: Update the relationship to the supplemental node of the preprint
      description: 'Update the supplemental node relationship for the specified preprint.

        #### Permissions - Must have `write` permissions on both the preprint and the target node.'
      tags:
      - Preprints
      operationId: preprint_node_relationship_update
      parameters:
      - name: preprint_id
        in: path
        required: true
        description: The unique identifier of the preprint.
        schema:
          type: string
      responses:
        '200':
          description: Successfully updated the supplemental node relationship.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required:
                    - id
                    - type
                    properties:
                      id:
                        type: string
                      type:
                        type: string
                        example: nodes
                  links:
                    type: object
                    properties:
                      self:
                        type: string
                      related:
                        type: string
        '400':
          description: Bad request. The node ID may be invalid or missing.
        '401':
          description: Unauthorized. Authentication is required.
        '403':
          description: Forbidden. You do not have permission to update this relationship.
        '404':
          description: Not Found. No preprint or node matches the given ID.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  required:
                  - type
                  - id
                  properties:
                    type:
                      type: string
                      example: nodes
                    id:
                      type: string
                      example: abc12
        description: The relationship data for the supplemental node.
        required: true
    delete:
      summary: Remove the supplemental node relationship from the preprint
      description: 'Remove the link between the preprint and its supplemental node.

        #### Permissions - Must have `write` permissions on the preprint.'
      tags:
      - Preprints
      operationId: preprint_node_relationship_delete
      parameters:
      - name: preprint_id
        in: path
        required: true
        description: The unique identifier of the preprint.
        schema:
          type: string
      responses:
        '204':
          description: Successfully removed the supplemental node relationship.
        '401':
          description: Unauthorized. Authentication is required.
        '403':
          description: Forbidden. You do not have permission to modify this relationship.
        '404':
          description: Not Found. No preprint matches the given ID.
  /preprints/{preprint_id}/requests/:
    post:
      summary: Create a Preprint Request
      description: 'Create a new request on the specified preprint. Typically used for withdrawal requests.

        #### Permissions - Must be an admin contributor on the preprint to create a request.'
      tags:
      - Preprints
      operationId: preprint_requests_create
      parameters:
      - name: preprint_id
        in: path
        required: true
        description: The unique identifier of the preprint to create a request for.
        schema:
          type: string
      responses:
        '201':
          description: Successfully created the preprint request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required:
                    - id
                    - type
                    - attributes
                    - relationships
                    properties:
                      id:
                        type: string
                        description: The unique identifier for this request.
                      type:
                        type: string
                        example: preprint-requests
                      attributes:
                        type: object
                        required:
                        - request_type
                        - machine_state
                        - comment
                        - created
                        - updated
                        properties:
                          request_type:
                            type: string
                          machine_state:
                            type: string
                          comment:
                            type: string
                          created:
                            type: string
                            format: date-time
                          updated:
                            type: string
                            format: date-time
                      relationships:
                        type: object
                        properties:
                          creator:
                            type: object
                            properties:
                              data:
                                type: object
                                required:
                                - id
                                - type
                                properties:
                                  id:
                                    type: string
                                  type:
                                    type: string
                            description: The user who created the request.
                          target:
                            type: object
                            properties:
                              data:
                                type: object
                                required:
                                - id
                                - type
                                properties:
                                  id:
                                    type: string
                                  type:
                                    type: string
                            description: The preprint targeted by this request.
                      links:
                        type: object
                        properties:
                          self:
                            type: string
        '400':
          description: Bad request. Invalid input or missing fields.
        '401':
          description: Unauthorized. Authentication is required.
        '403':
          description: Forbidden. You do not have permission to create a request.
        '404':
          description: Not Found. No preprint matches the given ID.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: object
                  required:
                  - type
                  - attributes
                  properties:
                    type:
                      type: string
                      example: preprint-requests
                    attributes:
                      type: object
                      required:
                      - request_type
                      - comment
                      properties:
                        request_type:
                          type: string
                          example: withdrawal
                          description: The type of request. Currently only `withdrawal` is supported.
                        comment:
                          type: string
                          description: Comment explaining the reason for the request.
        description: The request object to be created.
        required: true
  /preprints/{preprint_id}/review_actions/:
    get:
      summary: List Review Actions for a Preprint
      description: 'Retrieve the list of review actions for the specified preprint.

        Review actions track state transitions and comments made during the review process.

        #### Permissions - Requires `view_actions` permission on the preprint''s provider for full visibility. - Some actions (like moderator comments) may be hidden if the provider has restrictions.'
      tags:
      - Preprints
      operationId: preprint_review_actions_list
      parameters:
      - name: preprint_id
        in: path
        required: true
        description: The unique identifier of the preprint whose review actions are being requested.
        schema:
          type: string
      responses:
        '200':
          description: Successful retrieval of review actions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - type
                      - attributes
                      - relationships
                      properties:
                        id:
                          type: string
                          description: The unique identifier of this review action.
                        type:
                          type: string
                          example: review-actions
                        attributes:
                          type: object
                          required:
                          - trigger
                          - from_state
                          - to_state
                          - date_created
                          - date_modified
                          properties:
                            trigger:
                              type: string
                              description: The action that was triggered, e.g., "accept", "reject", "withdraw".
                            from_state:
                              type: string
                              description: The workflow state before this action.
                            to_state:
                              type: string
                              description: The workflow state after this action.
                            comment:
                              type: string
                              description: The comment added by the user performing the action.
                            date_created:
                              type: string
                              format: date-time
                              description: The date the action was created.
                            date_modified:
                              type: string
                              format: date-time
                              description: The date the action was last modified.
                        relationships:
                          type: object
                          properties:
                            creator:
                              type: object
                              properties:
                                data:
                                  type: object
                                  required:
                                  - id
                                  - type
                                  properties:
                                    id:
                                      type: string
                                      description: The ID of the user who created the action.
                                    type:
                                      type: string
                                      example: users
                            provider:
                              type: object
                              properties:
                                data:
                                  type: object
                                  required:
                                  - id
                                  - type
                                  properties:
                                    id:
                                      type: string
                                      description: The ID of the preprint provider.
                                    type:
                                      type: string
                                      example: preprint_providers
                            target:
                              type: object
                              properties:
                                data:
                                  type: object
                                  required:
                                  - id
                                  - type
                                  properties:
                                    id:
                                      type: string
                                      description: The ID of the target preprint.
                                    type:
                                      type: string
                                      example: preprints
                        links:
                          type: object
                          properties:
                            self:
                              type: string
                              description: API link to the review action resource.
                  meta:
                    type: object
                    description: Pagination or additional metadata.
              example:
                data:
                - id: rwa1
                  type: review-actions
                  attributes:
                    trigger: accept
                    from_state: pending
                    to_state: accepted
                    comment: Looks good.
                    date_created: '2023-05-10T14:00:00Z'
                    date_modified: '2023-05-10T14:00:00Z'
                  relationships:
                    creator:
                      data:
                        id: abc123
                        type: users
                    provider:
                      data:
                        id: osf
                        type: preprint_providers
                    target:
                      data:
                        id: abc12
                        type: preprints
                  links:
                    self: https://api.osf.io/v2/preprints/abc12/review_actions/rwa1/
                - id: rwa2
                  type: review-actions
                  attributes:
                    trigger: reject
                    from_state: pending
                    to_state: rejected
                    comment: Needs more revisions.
                    date_created: '2023-06-15T10:30:00Z'
                    date_modified: '2023-06-15T10:30:00Z'
                  relationships:
                    creator:
                      data:
                        id: mod456
                        type: users
                    provider:
                      data:
                        id: osf
                        type: preprint_providers
                    target:
                      data:
                        id: abc12
                        type: preprints
                  links:
                    self: https://api.osf.io/v2/preprints/abc12/review_actions/rwa2/
        '401':
          description: Unauthorized. Authentication is required.
        '403':
          description: Forbidden. You do not have permission to view these review actions.
        '404':
          description: Not Found. No preprint matches the given ID.
  /preprints/{preprint_id}/subjects/:
    get:
      summary: List Preprint Subjects
      description: 'Retrieve the list of subjects (taxonomy terms) associated with a specific preprint.

        #### Permissions - Preprint subjects are publicly accessible for published preprints. - For unpublished preprints, you must have permission to view the preprint.'
      tags:
      - Preprints
      operationId: preprint_subjects_list
      parameters:
      - name: preprint_id
        in: path
        required: true
        description: The unique identifier of the preprint whose subjects are being requested.
        schema:
          type: string
      responses:
        '200':
          description: Successful retrieval of preprint subjects.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - type
                      - attributes
                      properties:
                        id:
                          type: string
                          description: The unique identifier of the subject.
                        type:
                          type: string
                          example: subjects
                        attributes:
                          type: object
                          properties:
                            text:
                              type: string
                              description: The name of the subject.
                            parent:
                              type: string
                              description: The parent subject ID, if applicable.
                        relationships:
                          type: object
                          properties:
                            children:
                              type: object
                              description: Relationship to any child subjects.
                              properties:
                                data:
                                  type: array
                                  items:
                                    type: object
                                    required:
                                    - id
                                    - type
                                    properties:
                                      id:
                                        type: string
                                        description: The unique identifier of the child subject.
                                      type:
                                        type: string
                                        example: subjects
                        links:
                          type: object
                          properties:
                            self:
                              type: string
                              description: Link to the subject resource.
                  meta:
                    type: object
                    description: Pagination or additional metadata.
              example:
                data:
                - id: '123'
                  type: subjects
                  attributes:
                    text: Cognitive Psychology
                    parent: '45'
                  relationships:
                    children:
                      data:
                      - id: '124'
                        type: subjects
                  links:
                    self: https://api.osf.io/v2/preprints/abc12/subjects/123/
                - id: '124'
                  type: subjects
                  attributes:
                    text: Developmental Psychology
                    parent: '123'
                  relationships:
                    children:
                      data: []
                  links:
                    self: https://api.osf.io/v2/preprints/abc12/subjects/124/
        '401':
          description: Unauthorized. Authentication is required.
        '403':
          description: Forbidden. You do not have permission to view these subjects.
        '404':
          description: Not Found. No preprint matches the given ID.
