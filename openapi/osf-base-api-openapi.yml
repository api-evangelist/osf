openapi: 3.2.0
info:
  title: OSF APIv2 Documentation Base API
  description: This is the official documentation for the OSF (Open Science Framework) API v2.
  version: '2.0'
  termsOfService: https://osf.io/terms_of_use/
  contact:
    name: OSF Support Team
    email: support@osf.io
    url: https://help.osf.io/
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  x-logo:
    url: https://cdn.cos.io/media/images/cos_center_logo_small.original.png
    backgroundColor: transparent
servers:
- url: https://api.test.osf.io/v2
tags:
- name: Base
  description: This is the "home page" of the API you can get important autentication information for the user making the request and get links to other resources.
paths:
  /:
    get:
      summary: Root
      description: '#### Returns

        A JSON object with `meta` and `links` keys.


        The `meta` key contains information such as a welcome message from the API, the specified version of the request, and the full representation of the current user, if authentication credentials were provided in the request.


        The `links` key contains links to the following entity collections: addons, collections, institutions, licenses, registration schemas, nodes, registrations, users'
      responses:
        '200':
          description: OK
      tags:
      - Base
      operationId: base_read
