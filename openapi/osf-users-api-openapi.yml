  /users/{user_id}/institutions/:
    get:
      summary: List all institutions
      description: 'A paginated list of institutions that the user is affiliated with.

        #### Returns

        Returns a JSON object containing `data` and `links` keys.


        The `data` key contains an array of 10 institutions. Each resource in the array is a complete institution object and contains the full representation of the institution, meaning additional requests to a institution''s detail view are not necessary.


        The `links` key contains a dictionary of links that can be used for pagination.'
      tags:
      - Users
      parameters:
      - in: path
        name: user_id
        required: true
        description: The unique identifier of the user.
        schema:
          type: string
      operationId: users_institutions_list
      x-response-schema: Institution
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  title: Institution
                  properties:
                    id:
                      type: string
                      readOnly: true
                      description: The identifier of the institution entity.
                    type:
                      type: string
                      readOnly: true
                      description: The type identifier of the institution entity (`institutions`).
                    attributes:
                      type: object
                      title: Attributes
                      readOnly: false
                      description: The properties of the institution entity.
                      properties:
                        name:
                          type: string
                          readOnly: true
                          description: Full name of the institution.
                        description:
                          type: string
                          readOnly: true
                          description: Description of the institution.
                        iri:
                          type: string
                          readOnly: true
                          description: Internationalized Resource Identifier (IRI) of the institution.
                        ror_iri:
                          type: string
                          readOnly: true
                          description: Research Organization Registry (ROR) IRI of the institution.
                        iris:
                          type: array
                          items:
                            type: string
                          readOnly: true
                          description: List of IRIs associated with the institution.
                        assets:
                          type: object
                          properties:
                            logo:
                              type: string
                              readOnly: true
                              description: URL to the institution's logo.
                            logo_rounded:
                              type: string
                              readOnly: true
                              description: URL to the institution's logo with rounded corners.
                            banner:
                              type: string
                              readOnly: true
                              description: URL to the institution's banner.
                            logo_path:
                              type: string
                              readOnly: true
                              description: Static path to the institution specific logo.
                    relationships:
                      type: object
                      title: Relationships
                      readOnly: true
                      description: URLs to other entities or entity collections that have a relationship to the institution entity.
                      properties:
                        nodes:
                          type: string
                          format: URL
                          readOnly: true
                          description: A relationship to the nodes affiliated with the institution.
                        users:
                          type: string
                          format: URL
                          readOnly: true
                          description: A relationship to the users affiliated with the institution.
                        registrations:
                          type: string
                          format: URL
                          readOnly: true
                          description: A relationship to the registrations affiliated with the institution.
                    links:
                      type: object
                      title: Links
                      readOnly: true
                      description: URLs to alternative representations of the institutions entity.
                      properties:
                        self:
                          type: string
                          format: URL
                          readOnly: true
                          description: A link to the detail page for the institution.
              example:
                data:
                - relationships:
                    nodes:
                      links:
                        related:
