  /users/{user_id}/settings/identities/{identity_id}:
    get:
      summary: Retrieve a User's External Identity
      description: 'Retrieves detailed information about a single external identity linked to the user.

        External identities represent accounts linked from external services or identity providers (e.g., ORCID, institutions).

        Only the authenticated user can view their own external identities.

        #### Returns

        Returns a JSON object with a `data` key containing the details of the requested external identity.

        #### Errors

        If the request is unsuccessful, an `errors` key containing information about the failure will be returned. Refer to the list of error codes to understand why this request may have failed.'
      tags:
      - Users
      operationId: user_identity_detail_read
      parameters:
      - in: path
        name: user_id
        required: true
        description: 'The unique identifier of the user whose external identity is being retrieved.

          Example: `abc123`'
        schema:
          type: string
      - in: path
        name: identity_id
        required: true
        description: 'The unique identifier of the external identity to retrieve.

          Example: `orcid`'
        schema:
          type: string
