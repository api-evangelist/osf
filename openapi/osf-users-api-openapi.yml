    delete:
      summary: Remove a User's External Identity
      description: 'Deletes (removes) an external identity from the user''s account.

        Only the authenticated user can delete their own external identities.

        #### Returns

        Returns a `204 No Content` response if the external identity was successfully removed.

        #### Errors

        If the request is unsuccessful, an `errors` key containing information about the failure will be returned. Refer to the list of error codes to understand why this request may have failed.'
      tags:
      - Users
      parameters:
      - in: path
        name: user_id
        required: true
        description: 'The unique identifier of the user whose external identity is being deleted.

          Example: `abc123`'
        schema:
          type: string
      - in: path
        name: identity_id
        required: true
        description: 'The unique identifier of the external identity to delete.

          Example: `orcid`'
        schema:
          type: string
      responses:
        '204':
          description: External identity successfully removed.
        '403':
          description: 'Permission denied.

            You do not have permission to remove external identities for this user.'
        '404':
          description: 'External identity not found.

            No identity with the given ID exists for this user.'
      operationId: deleteUsersByUserIdSettingsIdentitiesByIdentityId
      x-operation-id-source: derived
  /users/{user_id}/settings/password/:
    post:
      summary: Change a User's Password
      description: 'Change the password for the specified user.

        Only the current authenticated user can change their own password using this endpoint.

        #### Returns

        Returns a `204 No Content` response if the password change was successful.

        #### Errors

        If the request is unsuccessful, an `errors` key containing information about the failure will be returned. Refer to the list of error codes to understand why this request may have failed.

        Some common error cases: - `400 Bad Request`: Invalid or missing password fields. - `403 Forbidden`: You are not authorized to change this user''s password. - `429 Too Many Requests`: Too many failed attempts; try again later.'
      tags:
      - Users
      operationId: user_password_change
      parameters:
      - in: path
        name: user_id
        required: true
        description: 'The unique identifier of the user whose password is being changed.

          Example: `abc123`'
        schema:
          type: string
      responses:
        '204':
          description: 'Password successfully changed.

            All sessions for the user will be logged out and must be re-authenticated.'
        '400':
          description: 'Bad request.

            The existing password is incorrect, or the new password is invalid.'
        '403':
          description: 'Permission denied.

            You do not have permission to change this user''s password.'
        '429':
          description: 'Too many failed attempts.

            Please wait before trying again.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    type:
                      type: string
                      enum:
                      - user_passwords
                      example: user_passwords
                    attributes:
                      type: object
                      properties:
                        existing_password:
                          type: string
                          description: The user's current password.
                          example: current_password_123
                        new_password:
                          type: string
                          description: The new password to set for the user.
                          example: new_secure_password_456
              required:
              - data
        description: 'A JSON API representation of the password change request.

          You must provide both the existing password and the new password.'
        required: true
