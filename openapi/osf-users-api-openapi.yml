  /users/{user_id}/relationships/institutions/:
    get:
      summary: Retrieve a User's Institution Relationships
      description: 'Retrieves the relationships between a user and their affiliated institutions.

        Only the authenticated user can view their affiliated institutions in this relationship endpoint.

        #### Returns

        Returns a JSON object with a `data` key containing an array of institution relationship identifiers.

        #### Errors

        If the request is unsuccessful, an `errors` key containing information about the failure will be returned. Refer to the list of error codes.'
      tags:
      - Users
      operationId: user_institutions_relationship_read
      parameters:
      - in: path
        name: user_id
        required: true
        description: 'The unique identifier of the user. Example: `abc123`'
        schema:
          type: string
      responses:
        '200':
          description: Successfully retrieved the user's affiliated institutions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: The institution ID.
                          example: mit
                        type:
                          type: string
                          description: Resource type.
                          example: institutions
              example:
                data:
                - id: mit
                  type: institutions
                - id: cambridge
                  type: institutions
        '403':
          description: Permission denied. You do not have permission to view these institution relationships.
        '404':
          description: User not found.
    delete:
      summary: Remove Institutions from a User's Affiliations
      description: 'Removes one or more institutions from a user''s list of affiliations.

        #### Usage Notes

        - Only the authenticated user can remove their institution affiliations. - You cannot add institutions through this endpoint—use the user-institutions list endpoint for reading full records.

        #### Returns

        Returns a `204 No Content` response if the removal is successful.

        #### Errors

        If the request is unsuccessful, an `errors` key containing information about the failure will be returned. Refer to the list of error codes.

        #### Example Request Payload

        ```json {

        "data": [

        { "type": "institutions", "id": "mit" },

        { "type": "institutions", "id": "cambridge" }

        ]

        } ```'
      tags:
      - Users
      operationId: user_institutions_relationship_delete
      parameters:
      - in: path
        name: user_id
        required: true
        description: 'The unique identifier of the user. Example: `abc123`'
        schema:
          type: string
      responses:
        '204':
          description: Successfully removed institutions from user's affiliations.
        '400':
          description: 'Bad request. Possible reasons include: - Institution `type` does not match `institutions`. - Institution ID is invalid or not affiliated with the user.'
        '403':
          description: Permission denied. You do not have permission to modify these affiliations.
        '404':
          description: User not found.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: array
                  items:
                    type: object
                    required:
                    - type
                    - id
                    properties:
                      type:
                        type: string
                        enum:
                        - institutions
                      id:
                        type: string
                        example: mit
        description: List of institution relationships to remove.
        required: true
  /users/{user_id}/settings/:
    get:
      summary: Retrieve a User's Settings
      description: 'Retrieves a user''s settings, including two-factor authentication status, email subscriptions, and deactivation status.

        Only the authenticated user can access their settings.

        #### Returns

        Returns a JSON object with a `data` key containing the user''s settings.

        #### Errors

        If the request is unsuccessful, an `errors` key containing information about the failure will be returned. Refer to the list of error codes.'
      tags:
      - Users
      operationId: user_settings_read
      parameters:
      - in: path
        name: user_id
        required: true
        description: 'The unique identifier of the user.

          Example: `abc123`'
        schema:
          type: string
      responses:
        '200':
          description: Successfully retrieved the user's settings.
          content:
            application/json:
              example:
                data:
                  id: abc123
                  type: user-settings
                  attributes:
                    two_factor_enabled: true
                    two_factor_confirmed: true
                    subscribe_osf_general_email: true
                    subscribe_osf_help_email: false
                    deactivation_requested: false
                    contacted_deactivation: false
        '403':
          description: Permission denied. You do not have permission to view these settings.
    patch:
      summary: Update a User's Settings
      description: 'Updates a user''s settings, including email subscriptions, two-factor authentication setup, and account deactivation status.

        Only the authenticated user can modify their settings.

        ## Editable Attributes


        - `two_factor_enabled` (boolean): Enables or disables two-factor authentication.

        - `two_factor_verification` (integer): Verification code for two-factor setup.

        - `subscribe_osf_general_email` (boolean): Subscribe/unsubscribe from OSF general communications.

        - `subscribe_osf_help_email` (boolean): Subscribe/unsubscribe from OSF help communications.

        - `deactivation_requested` (boolean): Request deactivation of your OSF account.


        #### Returns

        Returns the updated user''s settings in a JSON object with a `data` key.

        #### Errors

        If the request is unsuccessful, an `errors` key containing information about the failure will be returned. Refer to the list of error codes.'
      tags:
      - Users
      operationId: user_settings_update
      parameters:
      - in: path
        name: user_id
        required: true
        description: 'The unique identifier of the user.

          Example: `abc123`'
        schema:
          type: string
      responses:
        '200':
          description: Successfully updated the user's settings.
        '400':
          description: Bad request. This can occur if the two-factor verification code is invalid, or subscription values are incorrect.
        '403':
          description: Permission denied. You do not have permission to update these settings.
        '404':
          description: User not found.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    type:
                      type: string
                      enum:
                      - user-settings
                      example: user-settings
                    id:
                      type: string
                      description: The user ID for the settings update.
                      example: abc123
                    attributes:
                      type: object
                      properties:
                        two_factor_enabled:
                          type: boolean
                          description: Enable or disable two-factor authentication.
                          example: true
                        two_factor_verification:
                          type: integer
                          description: Verification code for two-factor authentication.
                          example: 123456
                        subscribe_osf_general_email:
                          type: boolean
                          description: Subscribe or unsubscribe from OSF general emails.
                          example: true
                        subscribe_osf_help_email:
                          type: boolean
                          description: Subscribe or unsubscribe from OSF help emails.
                          example: false
                        deactivation_requested:
                          type: boolean
                          description: Request deactivation of your OSF account.
                          example: false
        description: JSON API representation of the updates to the user's settings.
        required: true
