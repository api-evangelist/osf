openapi: 3.2.0
info:
  title: OSF APIv2 Documentation Users API
  description: This is the official documentation for the OSF (Open Science Framework) API v2.
  version: '2.0'
  termsOfService: https://osf.io/terms_of_use/
  contact:
    name: OSF Support Team
    email: support@osf.io
    url: https://help.osf.io/
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  x-logo:
    url: https://cdn.cos.io/media/images/cos_center_logo_small.original.png
    backgroundColor: transparent
servers:
- url: https://api.test.osf.io/v2
tags:
- name: Users
  description: Users represent individual accounts within the OSF (Open Science Framework) platform.
paths:
  /users/:
    get:
      summary: List all users
      description: 'A paginated list of all users registered on the OSF. The returned users are sorted by their `date_registered`, with the most recently registered users appearing first.


        The subroute `/users/me/` is a special endpoint that always points to the currently logged-in user.

        #### Versioning

        As of version `2.3`, merged users will not be returned from this endpoint.

        #### Returns

        Returns a JSON object containing `data` and `links` keys.


        The `data` key contains an array of 10 users. Each resource in the array is a separate users object and contains the full representation of the user, meaning additional requests to a user''s detail view are not necessary.


        The `links` key contains a dictionary of links that can be used for pagination.


        This request should never return an error.

        #### Filtering

        You can optionally request that the response only include nodes that match your filters by utilizing the `filter` query parameter, e.g. https://api.osf.io/v2/users/?filter[family_name]=Nosek.


        Users may be filtered by their `id`, `full_name`, `given_name`, `middle_name`, or `family_name`.'
      tags:
      - Users
      operationId: users_list
      x-response-schema: User
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  title: User
                  required:
                  - id
                  - type
                  - attributes
                  - relationships
                  - links
                  properties:
                    id:
                      type: string
                      readOnly: true
                      description: The unique identifier of the user entity.
                    type:
                      type: string
                      readOnly: true
                      description: The type identifier of the user entity (`users`).
                    attributes:
                      type: object
                      title: Attributes
                      readOnly: false
                      description: The properties of the user entity.
                      required:
                      - active
                      - date_registered
                      - full_name
                      properties:
                        active:
                          type: boolean
                          readOnly: true
                          description: Whether or not the user is an active user.
                        date_registered:
                          type: string
                          format: date-time
                          readOnly: true
                          description: The time at which the user registered their account, as an iso8601 formatted timestamp.
                        family_name:
                          type: string
                          readOnly: false
                          description: The family name of the user, used for bibliographic citations.
                        full_name:
                          type: string
                          readOnly: false
                          description: The full name of the user, used for display on the OSF.
                        given_name:
                          type: string
                          readOnly: false
                          description: The given name of the user, used for bibliographic citations.
                        middle_names:
                          type: string
                          readOnly: false
                          description: The middle names of the user, used for bibliographic citations.
                        suffix:
                          type: string
                          readOnly: false
                          description: The suffix of the user, used for bibliographic citations.
                        locale:
                          type: string
                          readOnly: false
                          description: The user's locale, e.g. 'en_US'.
                        timezone:
                          type: string
                          readOnly: false
                          description: The user's timezone, e.g. 'Etc/UTC'.
                        social:
                          type: object
                          readOnly: false
                          additionalProperties: true
                          description: "A dictionary of the user's social and academic profile links. \nFields may include:\n- `github`, `twitter`, `linkedIn`: List of profile URLs (strings)\n- `scholar`, `orcid`, `researcherId`, `impactStory`, etc.: Single URL string\n- `profileWebsites`: List of personal website URLs (strings)\n"
                        employment:
                          type: array
                          readOnly: false
                          description: A list of the user's employment history records.
                          items:
                            type: object
                            required:
                            - institution
                            - startYear
                            - startMonth
                            - ongoing
                            properties:
                              title:
                                type: string
                              institution:
                                type: string
                              department:
                                type: string
                              startYear:
                                type: integer
                                minimum: 1900
                              startMonth:
                                type: integer
                                minimum: 1
                                maximum: 12
                              endYear:
                                type: integer
                                minimum: 1900
                              endMonth:
                                type: integer
                                minimum: 1
                                maximum: 12
                              ongoing:
                                type: boolean
                        education:
                          type: array
                          readOnly: false
                          description: A list of the user's educational history records.
                          items:
                            type: object
                            required:
                            - institution
                            - startYear
                            - startMonth
                            - ongoing
                            properties:
                              degree:
                                type: string
                              institution:
                                type: string
                              department:
                                type: string
                              startYear:
                                type: integer
                                minimum: 1900
                              startMonth:
                                type: integer
                                minimum: 1
                                maximum: 12
                              endYear:
                                type: integer
                                minimum: 1900
                              endMonth:
                                type: integer
                                minimum: 1
                                maximum: 12
                              ongoing:
                                type: boolean
                    relationships:
                      type: object
                      title: Relationships
                      readOnly: true
                      description: URLs to other entities or entity collections that have a relationship to the user entity.
                      properties:
                        institutions:
                          type: string
                          readOnly: true
                          description: A link to the list of institutions the user is affiliated with.
                        nodes:
                          type: string
                          readOnly: true
                          description: A link to the list of nodes the user is a contributor to.
                    links:
                      type: object
                      title: Links
                      readOnly: true
                      description: URLs to alternative representations of the user entity.
                      properties:
                        html:
                          type: string
                          format: URL
                          readOnly: true
                          description: A link to the user's profile page on the OSF.
                        profile_image:
                          type: string
                          format: URL
                          readOnly: true
                          description: A link to the user's profile image.
                  example:
                    data:
                      type: users
                      id: '{user_id}'
                      attributes:
                        full_name: Casey M. Rollins
                        middle_names: Marie
                        social:
                          github:
                          - https://github.com/caseyrollins
                          twitter:
                          - https://twitter.com/crollins
                        employment:
                        - title: Data Scientist
                          institution: Open Science Framework
                          department: Engineering
                          startYear: 2018
                          startMonth: 5
                          ongoing: true
                        education:
                        - degree: MS in Computer Science
                          institution: University of Somewhere
                          department: Computer Science
                          startYear: 2014
                          startMonth: 9
                          endYear: 2016
                          endMonth: 6
                          ongoing: false
              example:
                data:
                - relationships:
                    nodes:
                      links:
                        related:
                          href: https://api.osf.io/v2/users/q7fts/nodes/
                          meta: {}
                    institutions:
                      links:
                        self:
                          href: https://api.osf.io/v2/users/q7fts/relationships/institutions/
                          meta: {}
                        related:
                          href: https://api.osf.io/v2/users/q7fts/institutions/
                          meta: {}
                  links:
                    self: https://api.osf.io/v2/users/q7fts/
                    html: https://osf.io/q7fts/
                    profile_image: https://secure.gravatar.com/avatar/e9d9311ab2f5ab7492a86ac9adb5c8e9?d=identicon
                  attributes:
                    family_name: Rollins
                    suffix: ''
                    locale: en_US
                    date_registered: '2014-06-15T17:39:06.701000'
                    middle_names: ''
                    given_name: Casey
                    full_name: Casey Rollins
                    active: true
                    timezone: America/New_York
                  type: users
                  id: q7fts
                links:
                  first: null
                  last: https://api.osf.io/v2/users/?page=4337
                  prev: null
                  next: https://api.osf.io/v2/users/?page=2
                  meta:
                    total: 43370
                    per_page: 10
  /users/{user_id}/:
    get:
      summary: Retrieve a user
      description: 'Retrieves details of a specific user.

        Includes bibliographic information, date of registration, and related resources such as affiliated institutions and nodes the user contributes to (provided the requesting user has access).

        Using `me` as the `user_id` retrieves the currently logged-in user''s information.

        #### Returns

        Successful responses return a JSON object under the `data` key with user details. Failed requests provide an `errors` key containing error information. Refer to the list of error codes for more details.'
      parameters:
      - in: path
        name: user_id
        required: true
        description: The unique identifier of the user.
        schema:
          type: string
      tags:
      - Users
      operationId: users_read
      x-response-schema: User
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                title: User
