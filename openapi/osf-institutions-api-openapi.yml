openapi: 3.2.0
info:
  title: OSF APIv2 Documentation Institutions API
  description: This is the official documentation for the OSF (Open Science Framework) API v2.
  version: '2.0'
  termsOfService: https://osf.io/terms_of_use/
  contact:
    name: OSF Support Team
    email: support@osf.io
    url: https://help.osf.io/
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  x-logo:
    url: https://cdn.cos.io/media/images/cos_center_logo_small.original.png
    backgroundColor: transparent
servers:
- url: https://api.test.osf.io/v2
tags:
- name: Institutions
paths:
  /institutions/:
    get:
      summary: List all institutions
      description: 'A paginated list of all verified institutions.

        #### Returns

        Returns a JSON object containing `data` and `links` keys.


        The `data` key contains an array of 10 institutions. Each resource in the array is a separate institution object.


        The `links` key contains a dictionary of links that can be used for pagination.


        This request should never return an error.

        #### Filtering

        You can optionally request that the response only include institutions that match your filters by utilizing the `filter` query parameter, e.g. https://api.osf.io/v2/institutions/?filter[id]=cos.


        Institutions may be filtered by their `id`, `name`, and `auth_url`'
      tags:
      - Institutions
      operationId: institutions_list
      x-response-schema: Institution
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  title: Institution
                  properties:
                    id:
                      type: string
                      readOnly: true
                      description: The identifier of the institution entity.
                    type:
                      type: string
                      readOnly: true
                      description: The type identifier of the institution entity (`institutions`).
                    attributes:
                      type: object
                      title: Attributes
                      readOnly: false
                      description: The properties of the institution entity.
                      properties:
                        name:
                          type: string
                          readOnly: true
                          description: Full name of the institution.
                        description:
                          type: string
                          readOnly: true
                          description: Description of the institution.
                        iri:
                          type: string
                          readOnly: true
                          description: Internationalized Resource Identifier (IRI) of the institution.
                        ror_iri:
                          type: string
                          readOnly: true
                          description: Research Organization Registry (ROR) IRI of the institution.
                        iris:
                          type: array
                          items:
                            type: string
                          readOnly: true
                          description: List of IRIs associated with the institution.
                        assets:
                          type: object
                          properties:
                            logo:
                              type: string
                              readOnly: true
                              description: URL to the institution's logo.
                            logo_rounded:
                              type: string
                              readOnly: true
                              description: URL to the institution's logo with rounded corners.
                            banner:
                              type: string
                              readOnly: true
                              description: URL to the institution's banner.
                            logo_path:
                              type: string
                              readOnly: true
                              description: Static path to the institution specific logo.
                    relationships:
                      type: object
                      title: Relationships
                      readOnly: true
                      description: URLs to other entities or entity collections that have a relationship to the institution entity.
                      properties:
                        nodes:
                          type: string
                          format: URL
                          readOnly: true
                          description: A relationship to the nodes affiliated with the institution.
                        users:
                          type: string
                          format: URL
                          readOnly: true
                          description: A relationship to the users affiliated with the institution.
                        registrations:
                          type: string
                          format: URL
                          readOnly: true
                          description: A relationship to the registrations affiliated with the institution.
                    links:
                      type: object
                      title: Links
                      readOnly: true
                      description: URLs to alternative representations of the institutions entity.
                      properties:
                        self:
                          type: string
                          format: URL
                          readOnly: true
                          description: A link to the detail page for the institution.
              example:
                data:
                - relationships:
                    nodes:
                      links:
                        related:
                          href: https://api.osf.io/v2/institutions/cos/nodes/
                          meta: {}
                    users:
                      links:
                        related:
                          href: https://api.osf.io/v2/institutions/cos/users/
                          meta: {}
                    registrations:
                      links:
                        related:
                          href: https://api.osf.io/v2/institutions/cos/registrations/
                          meta: {}
                    department_metrics:
                      links:
                        related:
                          href: https://api.osf.io/v2/institutions/cos/metrics/departments/
                          meta: {}
                    users_metrics:
                      links:
                        related:
                          href: https://api.osf.io/v2/institutions/cos/metrics/users/
                          meta: {}
                    summary_metrics:
                      links:
                        related:
                          href: https://api.osf.io/v2/institutions/cos/metrics/sumary/
                          meta: {}
                        data:
                          id: cos
                          type: institution-summary-metrics
                  links:
                    self: https://api.osf.io/v2/institutions/cos/
                  attributes:
                    name: Center For Open Science
                    description: COS is a non-profit technology company providing free and open services to increase inclusivity and transparency of research. Find out more at <a href="https://cos.io">cos.io</a>.
                    iri: http://www.test.edu
                    ror_iri: https://ror.org/000000000
                    iris:
                    - https://ror.org/000000000
                    - http://www.test.edu/
                    - https://osf.io/institutions/test/
                    assets:
                      logo: https://storage.test.com/test-shield.png
                      logo_rounded: https://storage.test.com/test-shield-rounded-corners.png
                      banner: https://storage.test.com/test-banner.png
                links:
                  first: null
                  last: https://api.osf.io/v2/institutions/cos/nodes/?page=2
                  prev: null
                  next: https://api.osf.io/v2/institutions/cos/nodes/?page=2
                  meta:
                    total: 15
                    per_page: 10
  /institutions/{institution_id}/:
    get:
      summary: Retrieve an institution
      description: 'Retrieves the details of an institution

        #### Returns

        Returns a JSON object with a `data` key containing the representation of the requested institution, if the request was successful.


        If the request is unsuccessful, an `errors` key containing information about the failure will be returned. Refer to the list of error codes to understand why this request may have failed.'
      parameters:
      - in: path
        required: true
        name: institution_id
        description: The unique identifier of the institution you wish to retrieve.
        schema:
          type: string
      tags:
      - Institutions
      operationId: institutions_detail
      x-response-schema: Institution
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  title: Institution
                  properties:
                    id:
                      type: string
                      readOnly: true
                      description: The identifier of the institution entity.
                    type:
                      type: string
                      readOnly: true
                      description: The type identifier of the institution entity (`institutions`).
                    attributes:
                      type: object
                      title: Attributes
                      readOnly: false
                      description: The properties of the institution entity.
                      properties:
                        name:
                          type: string
                          readOnly: true
                          description: Full name of the institution.
                        description:
                          type: string
                          readOnly: true
                          description: Description of the institution.
                        iri:
                          type: string
                          readOnly: true
                          description: Internationalized Resource Identifier (IRI) of the institution.
                        ror_iri:
                          type: string
                          readOnly: true
                          description: Research Organization Registry (ROR) IRI of the institution.
                        iris:
                          type: array
                          items:
                            type: string
                          readOnly: true
                          description: List of IRIs associated with the institution.
                        assets:
                          type: object
                          properties:
                            logo:
                              type: string
                              readOnly: true
                              description: URL to the institution's logo.
                            logo_rounded:
                              type: string
                              readOnly: true
                              description: URL to the institution's logo with rounded corners.
                            banner:
                              type: string
                              readOnly: true
                              description: URL to the institution's banner.
                            logo_path:
                              type: string
                              readOnly: true
                              description: Static path to the institution specific logo.
                    relationships:
                      type: object
                      title: Relationships
                      readOnly: true
                      description: URLs to other entities or entity collections that have a relationship to the institution entity.
                      properties:
                        nodes:
                          type: string
                          format: URL
                          readOnly: true
                          description: A relationship to the nodes affiliated with the institution.
                        users:
                          type: string
                          format: URL
                          readOnly: true
                          description: A relationship to the users affiliated with the institution.
                        registrations:
                          type: string
                          format: URL
                          readOnly: true
                          description: A relationship to the registrations affiliated with the institution.
                    links:
                      type: object
                      title: Links
                      readOnly: true
                      description: URLs to alternative representations of the institutions entity.
                      properties:
                        self:
                          type: string
                          format: URL
                          readOnly: true
                          description: A link to the detail page for the institution.
              example:
                data:
                  relationships:
                    nodes:
                      links:
                        related:
                          href: https://api.osf.io/v2/institutions/cos/nodes/
                          meta: {}
                    users:
                      links:
                        related:
                          href: https://api.osf.io/v2/institutions/cos/users/
                          meta: {}
                    registrations:
                      links:
                        related:
                          href: https://api.osf.io/v2/institutions/cos/registrations/
                          meta: {}
                    department_metrics:
                      links:
                        related:
                          href: https://api.osf.io/v2/institutions/cos/metrics/departments/
                          meta: {}
                    users_metrics:
                      links:
                        related:
                          href: https://api.osf.io/v2/institutions/cos/metrics/users/
                          meta: {}
                    summary_metrics:
                      links:
                        related:
                          href: https://api.osf.io/v2/institutions/cos/metrics/sumary/
                          meta: {}
                        data:
                          id: cos
                          type: institution-summary-metrics
                  links:
                    self: https://api.osf.io/v2/institutions/cos/
                  attributes:
                    name: Center For Open Science
                    description: COS is a non-profit technology company providing free and open services to increase inclusivity and transparency of research. Find out more at <a href="https://cos.io">cos.io</a>.
                    iri: http://www.test.edu
                    ror_iri: https://ror.org/000000000
                    iris:
                    - https://ror.org/000000000
                    - http://www.test.edu/
                    - https://osf.io/institutions/test/
                    assets:
                      logo: https://storage.test.com/test-shield.png
                      logo_rounded: https://storage.test.com/test-shield-rounded-corners.png
                      banner: https://storage.test.com/test-banner.png
                  type: institutions
                  id: cos
  /institutions/{institution_id}/users/:
    get:
      summary: List all affiliated users
      description: 'A paginated list of all users affiliated with an institution.

        #### Returns

        Returns a JSON object containing `data` and `links` keys.


        The `data` key contains an array of 10 users. Each resource in the array is a separate users object.


        The `links` key contains a dictionary of links that can be used for pagination.


        If the request is unsuccessful, an `errors` key containing information about the failure will be returned. Refer to the list of error codes to understand why this request may have failed.

        #### Filtering

        You can optionally request that the response only include users that match your filters by utilizing the `filter` query parameter, e.g. https://api.osf.io/v2/institutions/cos/users?filter[family_name]=Nosek.


        Users may be filtered by their `id`, `full_name`, `given_name`, `middle_names`, and `family_name`'
      parameters:
      - in: path
        required: true
        name: institution_id
        description: The unique identifier of the institution you wish to retrieve.
        schema:
          type: string
      tags:
      - Institutions
      operationId: institutions_users_list
      x-response-schema: User
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  title: User
                  required:
                  - id
                  - type
                  - attributes
                  - relationships
                  - links
                  properties:
                    id:
                      type: string
                      readOnly: true
                      description: The unique identifier of the user entity.
                    type:
                      type: string
                      readOnly: true
                      description: The type identifier of the user entity (`users`).
                    attributes:
                      type: object
                      title: Attributes
                      readOnly: false
                      description: The properties of the user entity.
                      required:
                      - active
                      - date_registered
                      - full_name
                      properties:
                        active:
                          type: boolean
                          readOnly: true
                          description: Whether or not the user is an active user.
                        date_registered:
                          type: string
                          format: date-time
                          readOnly: true
                          description: The time at which the user registered their account, as an iso8601 formatted timestamp.
                        family_name:
                          type: string
                          readOnly: false
                          description: The family name of the user, used for bibliographic citations.
                        full_name:
                          type: string
                          readOnly: false
                          description: The full name of the user, used for display on the OSF.
                        given_name:
                          type: string
                          readOnly: false
                          description: The given name of the user, used for bibliographic citations.
                        middle_names:
                          type: string
                          readOnly: false
                          description: The middle names of the user, used for bibliographic citations.
                        suffix:
                          type: string
                          readOnly: false
                          description: The suffix of the user, used for bibliographic citations.
                        locale:
                          type: string
                          readOnly: false
                          description: The user's locale, e.g. 'en_US'.
                        timezone:
                          type: string
                          readOnly: false
                          description: The user's timezone, e.g. 'Etc/UTC'.
                        social:
                          type: object
                          readOnly: false
                          additionalProperties: true
                          description: "A dictionary of the user's social and academic profile links. \nFields may include:\n- `github`, `twitter`, `linkedIn`: List of profile URLs (strings)\n- `scholar`, `orcid`, `researcherId`, `impactStory`, etc.: Single URL string\n- `profileWebsites`: List of personal website URLs (strings)\n"
                        employment:
                          type: array
                          readOnly: false
                          description: A list of the user's employment history records.
                          items:
                            type: object
                            required:
                            - institution
                            - startYear
                            - startMonth
                            - ongoing
                            properties:
                              title:
                                type: string
                              institution:
                                type: string
                              department:
                                type: string
                              startYear:
                                type: integer
                                minimum: 1900
                              startMonth:
                                type: integer
                                minimum: 1
                                maximum: 12
                              endYear:
                                type: integer
                                minimum: 1900
                              endMonth:
                                type: integer
                                minimum: 1
                                maximum: 12
                              ongoing:
                                type: boolean
                        education:
                          type: array
                          readOnly: false
                          description: A list of the user's educational history records.
                          items:
                            type: object
                            required:
                            - institution
                            - startYear
                            - startMonth
                            - ongoing
                            properties:
                              degree:
                                type: string
                              institution:
                                type: string
                              department:
                                type: string
                              startYear:
                                type: integer
                                minimum: 1900
                              startMonth:
                                type: integer
                                minimum: 1
                                maximum: 12
                              endYear:
                                type: integer
                                minimum: 1900
                              endMonth:
                                type: integer
                                minimum: 1
                                maximum: 12
                              ongoing:
                                type: boolean
                    relationships:
                      type: object
                      title: Relationships
                      readOnly: true
                      description: URLs to other entities or entity collections that have a relationship to the user entity.
                      properties:
                        institutions:
                          type: string
                          readOnly: true
                          description: A link to the list of institutions the user is affiliated with.
                        nodes:
                          type: string
                          readOnly: true
                          description: A link to the list of nodes the user is a contributor to.
                    links:
                      type: object
                      title: Links
                      readOnly: true
                      description: URLs to alternative representations of the user entity.
                      properties:
                        html:
                          type: string
                          format: URL
                          readOnly: true
                          description: A link to the user's profile page on the OSF.
                        profile_image:
                          type: string
                          format: URL
                          readOnly: true
                          description: A link to the user's profile image.
                  example:
                    data:
                      type: users
                      id: '{user_id}'
                      attributes:
                        full_name: Casey M. Rollins
                        middle_names: Marie
                        social:
                          github:
                          - https://github.com/caseyrollins
                          twitter:
                          - https://twitter.com/crollins
                        employment:
                        - title: Data Scientist
                          institution: Open Science Framework
                          department: Engineering
                          startYear: 2018
                          startMonth: 5
                          ongoing: true
                        education:
                        - degree: MS in Computer Science
                          institution: University of Somewhere
                          department: Computer Science
                          startYear: 2014
                          startMonth: 9
                          endYear: 2016
                          endMonth: 6
                          ongoing: false
              example:
                data:
                - relationships:
                    nodes:
                      links:
                        related:
                          href: https://api.osf.io/v2/users/cdi38/nodes/
                          meta: {}
                    institutions:
                      links:
                        self:
                          href: https://api.osf.io/v2/users/cdi38/relationships/institutions/
                          meta: {}
                        related:
                          href: https://api.osf.io/v2/users/cdi38/institutions/
                          meta: {}
                  links:
                    self: https://api.osf.io/v2/users/cdi38/
                    html: https://osf.io/cdi38/
                    profile_image: https://secure.gravatar.com/avatar/37fc491096861dae49fe23ba665af56b?d=identicon
                  attributes:
                    family_name: Nosek
                    suffix: ''
                    locale: en_US
                    date_registered: '2012-05-31T05:29:01.320000'
                    middle_names: A.
                    given_name: Brian
                    full_name: Brian A. Nosek
                    active: true
                    timezone: America/New_York
                  type: users
                  id: cdi38
                links:
                  first: null
                  last: https://api.osf.io/v2/institutions/cos/users/?page=8
                  prev: null
                  next: https://api.osf.io/v2/institutions/cos/users/?page=2
                  meta:
                    total: 77
                    per_page: 10
  /institutions/{institution_id}/nodes/:
    get:
      summary: List all affiliated nodes
      description: 'A paginated list of all nodes affiliated with an institution.

        #### Versioning

        As of version `2.2`, affiliated components (in addition to affiliated top-level projects) are returned from this endpoint.

        #### Returns

        Returns a JSON object containing `data` and `links` keys.


        The `data` key contains an array of 10 nodes. Each resource in the array is a separate nodes object.


        The `links` key contains a dictionary of links that can be used for pagination.


        If the request is unsuccessful, an `errors` key containing information about the failure will be returned. Refer to the list of error codes to understand why this request may have failed.

        #### Filtering

        You can optionally request that the response only include nodes that match your filters by utilizing the `filter` query parameter, e.g. https://api.osf.io/v2/institutions/cos/nodes?filter[title]=science.


        Nodes may be filtered by their `id`, `title`, `description`, `public`, `tags`, `category`, `date_created`, `date_modified`, `root`, `parent`, `contributors`, and `preprint`'
      parameters:
      - in: path
        required: true
        name: institution_id
        description: The unique identifier of the institution you wish to retrieve.
        schema:
          type: string
      tags:
      - Institutions
      operationId: institutions_node_list
      x-response-schema: Node
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  title: Node
                  required:
                  - type
                  - attributes
                  properties:
                    id:
                      type: string
                      readOnly: true
                      description: The unique identifier of the node entity.
                    type:
                      type: string
                      readOnly: false
                      description: The type identifier of the node entity (`nodes`).
                    attributes:
                      type: object
                      title: Attributes
                      readOnly: false
                      description: The properties of the node entity.
                      required:
                      - title
                      - category
                      properties:
                        category:
                          type: string
                          readOnly: false
                          enum:
                          - analysis
                          - communication
                          - data
                          - hypothesis
                          - instrumentation
                          - methods and measures
                          - procedure
                          - project
                          - software
                          - other
                          description: The category of the node, as selected by project contributors.
                        title:
                          type: string
                          readOnly: false
                          description: The title of the node.
                        collection:
                          type: boolean
                          readOnly: true
                          description: Whether or not this node represents a collection. This value should always be `false`. This field may be deprecated in future versions.
                        current_user_can_comment:
                          type: boolean
                          readOnly: true
                          description: Whether or not the current user has permission to post comments on this node. Comments on nodes can be set to allow all users to comment (if public) or restricted to only allow comments from contributors.
                        current_user_permissions:
                          type: array
                          items:
                            type: string
                          readOnly: true
                          description: A list of strings representing the permissions for the current user on this node. Valid permissions are "admin", "read", and "write".
                        date_created:
                          type: string
                          format: date-time
                          readOnly: true
                          description: The time at which the node was created, as an iso8601 formatted timestamp.
                        date_modified:
                          type: string
                          format: date-time
                          readOnly: true
                          description: The time at which the node was last modified, as an iso8601 formatted timestamp.
                        description:
                          type: string
                          readOnly: false
                          description: The description of the node.
                        fork:
                          type: boolean
                          readOnly: true
                          description: Whether or not this node represents a fork of another node.
                        forked_date:
                          type: string
                          format: date-time
                          readOnly: true
                          description: If this node is a fork of another node, the time at which the node was created, as an iso8601 formatted timestamp.
                        node_license:
                          type: string
                          readOnly: false
                          description: A dictionary containing the metadata (copyright year and holder) associated with the node license (required for certain license types).
                        preprint:
                          type: boolean
                          readOnly: true
                          description: Whether or not a preprint has been created from this node, or if this node was created for a preprint.
                        public:
                          type: boolean
                          readOnly: false
                          description: Whether or not the node is publicly visible. This field is only editable by project administrators.
                        registration:
                          type: boolean
                          readOnly: true
                          description: Whether or not the node represents a registration. This value should always be `false`. This field may be deprecated in future versions.
                        tags:
                          type: array
                          items:
                            type: string
                          readOnly: false
                          description: A list of strings that describe this node, as entered by project contributors.
                        template_from:
                          type: string
                          readOnly: false
                          description: The unique ID of the node from which this node was templated, if this node was created from a template.
                    relationships:
                      type: object
                      title: Relationships
                      readOnly: false
                      description: URLs to other entities or entity collections that have a relationship to the node entity.
                      properties:
                        affiliated_institutions:
                          type: string
                          readOnly: true
                          description: A link to the list of institutions this node is affiliated with.
                        children:
                          type: string
                          readOnly: true
                          description: A link to the list of this node's children (components).
                        citation:
                          type: string
                          readOnly: true
                          description: A link to the citation details of this node.
                        comments:
                          type: string
                          readOnly: true
                          description: A link to the list of comments on this node.
                        contributors:
                          type: string
                          readOnly: true
                          description: A link to the list of contributors on this node.
                        draft_registrations:
                          type: string
                          readOnly: true
                          description: A link to the list of registrations that have been initiated from this node and are still in a draft state.
                        files:
                          type: string
                          readOnly: true
                          description: A link to the list of storage providers that have been enabled on this node.
                        forked_from:
                          type: string
                          readOnly: true
                          description: A link to the node which this node was forked from, if this node is a fork.
                        forks:
                          type: string
                          readOnly: true
                          description: A link to the list of nodes that are forks of this node.
                        identifiers:
                          type: string
                          readOnly: true
                          description: A link to the list of identifiers for this node (i.e. ARK and DOI identifiers).
                        license:
                          type: string
                          readOnly: true
                          description: A link to the license that has been applied to this node.
                        logs:
                          type: string
                          readOnly: true
                          description: A link to the list of log actions pertaining to this node.
                        linked_nodes:
                          type: string
                          readOnly: true
                          description: A link to the list of nodes that are linked to the current node.
                        node_links:
                          type: string
                          readOnly: true
                          description: A link to the list of nodes that are linked to the current node. This field is deprecated as of verson 2.1; use the linked_nodes link instead.
                        parent:
                          type: string
                          readOnly: true
                          description: A link to the node that is the direct parent of the current node, if the current node is a child node.
                        preprints:
