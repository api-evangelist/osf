                          readOnly: true
                          description: The properties of the preprint provider entity.
                          properties:
                            social_instagram:
                              type: string
                              readOnly: true
                              description: The preprint provider's Instagram account ID. This field is deprecated as of verson 2.4.
                            advisory_board:
