openapi: 3.2.0
info:
  title: OSF APIv2 Documentation Licenses API
  description: This is the official documentation for the OSF (Open Science Framework) API v2.
  version: '2.0'
  termsOfService: https://osf.io/terms_of_use/
  contact:
    name: OSF Support Team
    email: support@osf.io
    url: https://help.osf.io/
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  x-logo:
    url: https://cdn.cos.io/media/images/cos_center_logo_small.original.png
    backgroundColor: transparent
servers:
- url: https://api.test.osf.io/v2
tags:
- name: Licenses
paths:
  /licenses/:
    get:
      summary: List all licenses
      description: 'A paginated list of licenses. The returned licenses are sorted by their name.

        #### Returns

        Returns a JSON object containing `data` and `links` keys.

        The `data` key contains an array of 10 licenses. Each resource in the array is a separate license object and contains the full representation of the license, meaning additional requests to a license''s detail view are not necessary.


        The `links` key contains a dictionary of links that can be used for pagination.


        This request should never return an error.

        #### Filtering

        You can optionally request that the response only include licenses that match your filters by utilizing the `filter` query parameter, e.g. [https://api.osf.io/v2/licenses/?filter[name]=apache](https://api.osf.io/v2/licenses/?filter[name]=apache).


        Licenses may be filtered by their `id`, and `name`.'
      tags:
      - Licenses
      operationId: license_list
      x-response-schema: License
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  title: License
                  properties:
                    id:
                      type: string
                      readOnly: true
                      description: The identifier of the license.
                    type:
                      type: string
                      readOnly: true
                      description: The type identifier of the license (`license`).
                    attributes:
                      type: object
                      title: Attributes
                      readOnly: true
                      description: The properties of the license.
                      properties:
                        name:
                          type: string
                          readOnly: true
                          description: Name of the license.
                        text:
                          type: string
                          readOnly: true
                          description: Full text of the license.
                        required_fields:
                          type: array
                          readOnly: true
                          description: Fields required for this license (provided to help front-end validators). Maps to properties on the NodeLicense model.
                          items:
                            type: string
                            readOnly: true
                            description: Individual fields required by this license.
                    links:
                      type: object
                      title: Links
                      readOnly: true
                      description: URLs to alternative representations of the license.
                      properties:
                        self:
                          type: string
                          format: URL
                          readOnly: true
                          description: A link to the detail page for the license.
              example:
                data:
                - links:
                    self: https://api.osf.io/v2/licenses/563c1cf88c5e4a3877f9e968/
                  attributes:
                    text: 'Copyright (c) {{year}}, {{copyrightHolders}}

                      All rights reserved.


                      The full descriptive text of the License.

                      '
                    required_fields:
                    - year
                    - copyrightHolders
                    name: BSD 2-Clause "Simplified" License
                  type: licenses
                  id: 563c1cf88c5e4a3877f9e968
                links:
                  first: ''
                  last: https://api.osf.io/v2/licenses/?page=2
                  prev: ''
                  next: https://api.osf.io/v2/licenses/?page=2
                  meta:
                    total: 16
                    per_page: 10
  /license/{license_id}/:
    get:
      summary: Retrieve a license
      description: 'Retrieves the details of a license.

        #### Returns

        Returns a JSON object with a `data` key containing the representation of the requested license, if the request is successful.


        If the request is unsuccessful, an `errors` key containing information about the failure will be returned. Refer to the list of error codes to understand why this request may have failed.'
      parameters:
      - in: path
        required: true
        name: license_id
        description: The unique identifier of the license.
        schema:
          type: string
      tags:
      - Licenses
      operationId: licenses_read
      x-response-schema: License
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                title: License
                properties:
                  id:
                    type: string
                    readOnly: true
                    description: The identifier of the license.
                  type:
                    type: string
                    readOnly: true
                    description: The type identifier of the license (`license`).
                  attributes:
                    type: object
                    title: Attributes
                    readOnly: true
                    description: The properties of the license.
                    properties:
                      name:
                        type: string
                        readOnly: true
                        description: Name of the license.
                      text:
                        type: string
                        readOnly: true
                        description: Full text of the license.
                      required_fields:
                        type: array
                        readOnly: true
                        description: Fields required for this license (provided to help front-end validators). Maps to properties on the NodeLicense model.
                        items:
                          type: string
                          readOnly: true
                          description: Individual fields required by this license.
                  links:
                    type: object
                    title: Links
                    readOnly: true
                    description: URLs to alternative representations of the license.
                    properties:
                      self:
                        type: string
                        format: URL
                        readOnly: true
                        description: A link to the detail page for the license.
              example:
                data:
                  links:
                    self: https://api.osf.io/v2/licenses/563c1cf88c5e4a3877f9e968/
                  attributes:
                    text: 'Copyright (c) {{year}}, {{copyrightHolders}}

                      All rights reserved.


                      The full descriptive text of the License

                      '
                    required_fields:
                    - year
                    - copyrightHolders
                    name: BSD 2-Clause "Simplified" License
                  type: licenses
                  id: 563c1cf88c5e4a3877f9e968
