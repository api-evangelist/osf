aid: osf

name: OSF

description: OSF (Open Science Framework) is a free, open-source platform that supports the entire research lifecycle, enabling collaboration,
  data sharing, and reproducible workflows. Researchers can register projects, collect data, manage materials, and publish results, all while
  integrating with tools like Dropbox, GitHub, and more. The platform emphasizes openness, inclusivity, and long-term preservation of scholarly
  outputs.

