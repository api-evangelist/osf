- aid: osf:osf-preprint-providers-api
  name: OSF Preprint Providers API
  description: "Preprint Providers are entities that manage and moderate groups of preprints on the OSF\
    \ platform.  \nEach Preprint Provider oversees its own preprint service, which can include branding,\
    \ theming, subject areas, moderation workflows, and licensing policies. Preprint Providers are often\
    \ affiliated with journals, societies, or research communities and enable researchers to share early\
    \ versions of their work.\nPreprint Providers can implement customizable review and moderation workflows,\
    \ as well as curate the preprints submitted to their service. Providers can also specify submission\
    \ requirements, allowable licenses, and taxonomies for classifying preprints.\n**Attributes include:**\n\
    \  - `id`: The unique identifier for the preprint provider.\n  - `name`: Human-readable name of the\
    \ provider.\n  - `description`: A description of the provider’s purpose and scope.\n  - `reviews_workflow`:\
    \ Defines the moderation workflow type (e.g., pre-moderation, post-moderation).\n  - `allow_submissions`:\
    \ Boolean indicating whether new preprints can be submitted.\n  - `licenses_acceptable`: List of licenses\
    \ accepted by the provider.\n  - `social_links`: Optional links to provider social media (e.g., Twitter,\
    \ Facebook).\n\n**Endpoints include:**\n  - List and detail views of Preprint Providers.\n  - Access\
    \ to preprints associated with a given provider.\n  - Access to taxonomies and licenses supported\
    \ by a provider.\n  - Management of moderators and submission actions within the provider's moderation\
    \ system.\n  - Retrieve citation styles associated with a specific preprint provider"
  humanURL: https://developer.osf.io
  baseURL: https://api.osf.io
  tags:
  - Preprint Providers
  properties:
  - type: OpenAPI
    url: openapi/osf-preprint-providers-api-openapi.yml
