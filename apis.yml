  description: "Registration Providers are entities that manage and moderate groups of registrations on\
    \ the OSF platform.  \nEach Registration Provider defines workflows, review policies, and customization\
    \ options for their collection of registrations. Registration Providers can be configured to operate\
    \ in different moderation modes, such as pre-moderation, post-moderation, or automated workflows.\n\
    Registration Providers may also specify accepted license types, registration schemas, taxonomies,\
    \ and review  workflows for their associated registrations. They allow communities or organizations\
    \ to manage the  visibility and curation of registered research within their domain.\n**Attributes\
    \ include:**\n  - `id`: The unique identifier for the registration provider.\n  - `name`: Human-readable\
    \ name of the provider.\n  - `description`: A description of the provider’s purpose and scope.\n \
    \ - `reviews_workflow`: Defines the moderation workflow type (e.g., pre-moderation, post-moderation).\n\
    \  - `allow_submissions`: Boolean indicating whether new registrations can be submitted.\n  - `licenses_acceptable`:\
    \ List of licenses accepted by the provider.\n\n**Endpoints include:**\n  - List and detail views\
    \ of Registration Providers.\n  - Access to registrations under a given provider.\n  - Access to registration\
    \ schemas and licenses supported by a provider.\n  - Management of moderators and submission actions\
    \ within the provider's moderation system."
