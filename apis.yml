- aid: osf:osf-notification-subscriptions-api
  name: OSF Notification Subscriptions API
  description: "**Notification Subscriptions** allow users to manage how they receive alerts about activities\
    \ and events  related to OSF resources, such as projects, preprints, registrations, and collections.\
    \ Subscriptions control  **when** notifications are sent and **which events** trigger them.\nThese\
    \ subscriptions are **private** and are only visible to the authenticated user who owns them.\n###\
    \ Subscription Scope and Types\nSubscriptions can be configured at different scopes depending on the\
    \ resource type:\n- **Global Subscriptions**  \n  Apply OSF-wide, affecting events like comment replies,\
    \ mentions, and review updates across all resources.\n\n- **Node Subscriptions**  \n  Apply to individual\
    \ projects or components (nodes), tracking events such as new comments or file updates.\n\n- **Provider\
    \ Subscriptions**  \n  Apply to resources within a specific provider (collection, preprint, or registration\
    \ providers). These subscriptions\n  typically track events relevant to moderation workflows, such\
    \ as new pending submissions.\n\n### Attributes\n- `event_name`  \n  The specific event that triggers\
    \ this subscription.  \n  Available event names depend on the scope of the subscription. Examples\
    \ include:\n    - `comments`\n    - `file_updated`\n    - `global_mentions`\n    - `new_pending_submissions`\n\
    \n- `frequency`  \n  Determines how often the user receives notifications for the event:\n    - `instant`:\
    \ Sends an email notification immediately after the event occurs.\n    - `daily`: Groups event notifications\
    \ into a daily summary email.\n    - `none`: Disables notifications for the event.\n\n  Users can\
    \ update their notification frequency for each subscription.\n\n### Relationships\n\n - `user`  \n\
    \  The user who owns the subscription. Each subscription is tied to a single user.\n - `provider`\
    \  \n  The provider associated with the subscription, if applicable. This may be a Collection Provider,\
    \ Preprint Provider, \n  or Registration Provider. Global subscriptions do not have a provider relationship.\n\
    \n### Available Event Names by Subscription Scope\n#### Node-Level Subscriptions Subscriptions specific\
    \ to individual projects or components:\n - `comments`: Notify when comments are added.\n - `file_updated`:\
    \ Notify when files are updated.\n\n#### Global Subscriptions Default notification preferences applied\
    \ OSF-wide:\n - `global_comment_replies`: Notify when someone replies to your comments.\n - `global_comments`:\
    \ Notify when comments are added to your projects.\n - `global_file_updated`: Notify when files are\
    \ updated in your projects.\n - `global_mentions`: Notify when you are mentioned.\n - `global_reviews`:\
    \ Notify when your preprint submissions are updated.\n\n#### Provider-Level Subscriptions Notifications\
    \ related to moderation workflows or submissions within a specific provider:\n - `new_pending_submissions`:\
    \ Notify when new preprint submissions are awaiting moderation.\n\n### Notification Channels\nNotifications\
    \ are delivered via **email**, according to the selected `frequency`:\n - `instant`: Immediate email\
    \ notifications per event.\n - `daily`: Batched email summary delivered daily.\n - `none`: No email\
    \ notifications are sent.\n\n### Permissions and Access\n\n - Only the authenticated user who owns\
    \ a subscription can view or update it.\n - Subscriptions are managed via the OSF API and reflect\
    \ the user's current notification preferences for supported events."
  humanURL: https://developer.osf.io
  baseURL: https://api.osf.io
  tags:
  - Notification Subscriptions
  properties:
  - type: OpenAPI
    url: openapi/osf-notification-subscriptions-api-openapi.yml
