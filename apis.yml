- aid: osf:osf-collection-providers-api
  name: OSF Collection Providers API
  description: >-
    A Collection Submissions Provider represents the data for moderators and admins for a group of collections.
    It acts as a central hub for managing all collection submissions within various collections, ensuring
    that the moderation process is handled efficiently and consistently across different collections.

    The Collection Submissions Provider holds important information, such as the list of moderators and
    admins, and the moderation rules for all collections under its umbrella. Historical data about past
    collection submissions and their states is saved via Collection Submission Actions.

    Through the Collection Submissions Provider, moderators can oversee the state of all submissions in
    collections they manage, ensuring that each submission follows the appropriate state transitions and
    adheres to the standards set for collection submissions. It aids in providing transparency and order
    to the process of managing collections and ensures that moderators and admins have the tools and information
    they need to effectively manage collection submissions.
  humanURL: https://developer.osf.io
  baseURL: https://api.osf.io
  tags:
