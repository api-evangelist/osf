- aid: osf:osf-users-api
  name: OSF Users API
  description: "Users represent individual accounts within the OSF (Open Science Framework) platform.\
    \ Each user account includes identifying information such as names, email addresses, profile details,\
    \  and metadata about activity and affiliations. The Users endpoints provide access to user-related\
    \ resources  for profile display, updates, affiliation management, node contributions, and interaction\
    \ with various OSF  services.\nThe Users API enables both read and write operations, allowing for:\n\
    \n - **Retrieving user information**: Includes full name, bibliographic name parts (given, middle,\
    \ family, suffix),\n  timezone, locale, account status, and registration date.\n - **Updating user\
    \ attributes**: Authenticated users can update certain profile fields such as name, locale, \n  timezone,\
    \ employment history, education, and social links.\n - **Managing relationships**: Users can access\
    \ related resources such as their affiliated institutions, \n  nodes they contribute to, registrations,\
    \ preprints, groups, and more.\n - **Accessing nested resources**: Email addresses, settings, external\
    \ identities, and export/download data.\n\nCertain fields and actions are restricted based on authentication\
    \ and permission levels. For example:\n\n - Viewing a user's full profile or updating information\
    \ requires authentication.\n - Some attributes and relationships (e.g., `emails`, `settings`) are\
    \ only accessible to the current user.\n - Accessing deactivated or anonymized users may return limited\
    \ metadata or result in error responses.\n\nUser profiles also support structured fields for `employment`\
    \ and `education` (e.g., `institution`, `title`,  `dates`, `ongoing` `status`) and `social` (e.g.,\
    \ `GitHub`, `ORCID`, `Twitter`), which are validated and  standardized for consistency and citation\
    \ accuracy.\nThese endpoints are fundamental for user discovery, personalization, and managing identity\
    \ and reputation  across the OSF ecosystem."
  humanURL: https://developer.osf.io
  baseURL: https://api.osf.io
  tags:
  - Users
  properties:
  - type: OpenAPI
    url: openapi/osf-users-api-openapi.yml
