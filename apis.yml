- aid: osf:osf-collection-submissions-api
  name: OSF Collection Submissions API
  description: >-
    A Collection Submission is an object that allows a user to add a resource, either a project, preprint,
    or registration to a collection. Once created, a Collection Submission may be automatically accepted
    or await moderation. Once a Collection Submission is in a moderation state, an assigned moderator
    may accept or reject the submission.

    There are a few states for Collection Submissions:

      - `in_progress` is the initial state of a Collection Submission where the resource is editable and
    still private.

      - `pending` is the state where the Collection Submission is awaiting moderation.

      - `accepted` means the Collection Submission has been approved and added to the collection.

      - `rejected` means the Collection Submission has been declined by the moderator.

      - `removed` means the Collection Submission has been removed from the collection, after initial
    acceptance.
  humanURL: https://developer.osf.io
  baseURL: https://api.osf.io
  tags:
  - Collection Submissions
